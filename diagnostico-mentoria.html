<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1426">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>[HOMOLOG] DEM · Diagnóstico Empresarial MELID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Variáveis do padrão aprovado (Diagnóstico de Autoridade v3) ===== */
  :root {
    color-scheme: dark;
    --v3-navy: #0B1426;
    --v3-surface: #111C33;
    --v3-surface-2: #16223D;
    --v3-line: #24304A;
    --v3-line-2: #2A3654;
    --v3-ivory: #F3EEE3;
    --v3-muted: #B8BFCC;
    --v3-muted-2: #8E97A8;
    --v3-body: #DCD6CA;
    --v3-gold: #D9B872;
    --v3-gold-strong: #C9A45C;
    /* derivados */
    --v3-gold-hover: #E3C68A;
    --v3-letter-line: #3A4766;
    --v3-gold-soft: rgba(217, 184, 114, 0.14);
    --v3-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif: "EB Garamond", Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--v3-navy); }
  body { overflow-x: hidden; }
  button, input { font: inherit; }
  img { display: block; }

  .v3-app {
    background: var(--v3-navy);
    color: var(--v3-ivory);
    font-family: Inter, system-ui, sans-serif;
  }
  .v3-gutter {
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
  }
  @media (min-width: 640px) {
    .v3-gutter {
      padding-left: max(2rem, env(safe-area-inset-left));
      padding-right: max(2rem, env(safe-area-inset-right));
    }
  }
  @media (min-width: 1024px) {
    .v3-gutter { padding-left: 3.5rem; padding-right: 3.5rem; }
  }

  /* Tipografia (EB Garamond no lugar da Cormorant, tamanhos ajustados) */
  .v3-eyebrow {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--v3-gold);
  }
  .v3-title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.25rem);
    line-height: 1.15;
    letter-spacing: -0.005em;
    color: var(--v3-ivory);
  }
  .v3-display {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.1rem, 1.5rem + 3.2vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--v3-ivory);
  }
  .v3-lead {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.25rem, 1.05rem + 0.8vw, 1.6rem);
    line-height: 1.4;
    color: var(--v3-body);
  }
  .v3-context {
    margin: 0;
    font-size: 16px;
    line-height: 1.6;
    color: var(--v3-muted);
  }
  @media (min-width: 640px) {
    .v3-context { font-size: 17px; }
  }
  .v3-hint {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--v3-muted-2);
  }
  .v3-rule {
    width: 48px;
    height: 1px;
    background: var(--v3-gold);
    opacity: 0.7;
  }

  /* Cartão clicável (opção, chip) */
  .v3-card {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: var(--v3-surface);
    border: 1px solid var(--v3-line);
    border-radius: 10px;
    color: var(--v3-ivory);
    font-family: Inter, system-ui, sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease;
  }
  .v3-card[data-selected="true"] {
    background: var(--v3-surface-2);
    border-color: var(--v3-gold);
  }
  .v3-card:disabled {
    cursor: not-allowed;
    opacity: 0.42;
  }
  .v3-card:focus-visible,
  .v3-btn:focus-visible,
  .v3-back:focus-visible {
    outline: 2px solid var(--v3-gold);
    outline-offset: 2px;
  }

  /* Marca da opção (A/B/C/D) e marca do chip */
  .v3-letter {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 9999px;
    border: 1px solid var(--v3-letter-line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--v3-muted);
    transition: background-color 0.25s var(--v3-ease), border-color 0.25s ease, color 0.25s ease;
  }
  .v3-card[data-selected="true"] .v3-letter {
    background: var(--v3-gold);
    border-color: var(--v3-gold);
    color: var(--v3-navy);
    font-weight: 600;
  }
  .v3-check {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1px solid var(--v3-letter-line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: background-color 0.25s var(--v3-ease), border-color 0.25s ease, color 0.2s ease;
  }
  .v3-card[data-selected="true"] .v3-check {
    background: var(--v3-gold);
    border-color: var(--v3-gold);
    color: var(--v3-navy);
  }

  /* Botão principal: dourado sólido, texto navy (o mesmo em todas as telas) */
  .v3-btn {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    min-height: 56px;
    padding: 0 1.75rem;
    border-radius: 10px;
    border: 1px solid var(--v3-gold);
    background: var(--v3-gold);
    color: var(--v3-navy);
    font-family: Inter, system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease;
    --v3-spot: rgba(255, 250, 238, 0.42);
    --v3-ripple: rgba(255, 255, 255, 0.5);
  }
  .v3-btn:disabled {
    cursor: not-allowed;
    opacity: 0.38;
  }

  /* Voltar: texto discreto, alvo de toque de 48 px */
  .v3-back {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    min-height: 48px;
    padding: 0 0.5rem;
    margin-left: -0.5rem;
    border-radius: 8px;
    background: none;
    border: none;
    color: var(--v3-muted);
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  /* Campo de texto */
  .v3-input {
    width: 100%;
    height: 56px;
    padding: 0 1rem;
    border-radius: 10px;
    border: 1px solid var(--v3-line-2);
    background: var(--v3-surface);
    color: var(--v3-ivory);
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px; /* 16px ou mais: o iPhone não aplica zoom */
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }
  .v3-input::placeholder {
    color: var(--v3-muted-2);
  }
  .v3-input:focus {
    border-color: var(--v3-gold);
    background: var(--v3-surface-2);
    box-shadow: 0 0 0 3px rgba(217, 184, 114, 0.16);
  }
  .v3-input[aria-invalid="true"] {
    border-color: var(--v3-gold-strong);
  }

  /* Barra fixa embaixo (celular), com respiro para a barra do iPhone */
  .v3-fixed-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    padding: 14px max(1rem, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    background: linear-gradient(to top, var(--v3-navy) 72%, rgba(11, 20, 38, 0));
  }

  /* Brilho dourado que segue o mouse (--mx/--my no mousemove) */
  .v3-spotlight {
    position: relative;
    isolation: isolate;
  }
  .v3-spotlight::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), var(--v3-spot, rgba(217, 184, 114, 0.13)), transparent 65%);
    transition: opacity 0.25s ease;
  }

  /* Onda dourada a partir do ponto do clique */
  .v3-ripple {
    position: absolute;
    border-radius: 9999px;
    pointer-events: none;
    background: var(--v3-ripple, rgba(217, 184, 114, 0.32));
    transform: scale(0);
    opacity: 1;
    animation: v3-ripple 0.6s var(--v3-ease) forwards;
  }
  @keyframes v3-ripple {
    to { transform: scale(1); opacity: 0; }
  }

  /* Movimento dos cartões e do botão: sobe no mouse, encolhe no clique */
  .v3-card, .v3-btn { transform: translateY(0); }
  .v3-card:not(:disabled):active, .v3-btn:not(:disabled):active { transform: scale(0.98); }
  .anda { transition-property: border-color, background-color, box-shadow, opacity, transform; transition-duration: 0.2s, 0.2s, 0.25s, 0.2s, 0.18s; transition-timing-function: ease, ease, ease, ease, ease-out; }
  .v3-letter.pulsa, .v3-check.pulsa { animation: pulsa 0.32s var(--v3-ease); }
  @keyframes pulsa { 50% { transform: scale(1.18); } }

  /* Resposta ao mouse: só em aparelhos com mouse */
  @media (hover: hover) {
    .v3-spotlight:hover::before { opacity: 1; }
    .v3-card:not(:disabled):hover {
      border-color: var(--v3-gold);
      box-shadow: 0 12px 28px -18px rgba(217, 184, 114, 0.5);
      transform: translateY(-2px);
    }
    .v3-card:not(:disabled):hover .v3-letter {
      border-color: var(--v3-gold);
      color: var(--v3-ivory);
    }
    .v3-card[data-selected="true"]:not(:disabled):hover .v3-letter { color: var(--v3-navy); }
    .v3-card:not(:disabled):hover .v3-check { border-color: var(--v3-gold); }
    .v3-btn:not(:disabled):hover {
      background: var(--v3-gold-hover);
      box-shadow: 0 14px 32px -16px rgba(217, 184, 114, 0.6);
      transform: translateY(-2px);
    }
    .v3-card:not(:disabled):hover:active, .v3-btn:not(:disabled):hover:active { transform: scale(0.98); }
    .v3-back:hover { color: var(--v3-ivory); }
    .btn-texto:hover { color: var(--v3-ivory); }
    .btn-contorno:not(:disabled):hover { background: var(--v3-gold-soft); color: var(--v3-gold-hover); }
  }

  /* ===== Estrutura da página ===== */
  .app { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }

  .faixa {
    margin: 10px auto 0;
    padding: 5px 12px;
    border: 1px solid var(--v3-gold);
    border-radius: 6px;
    color: var(--v3-gold);
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.08em;
    text-align: center;
    max-width: calc(100% - 2rem);
  }

  .topo { flex-shrink: 0; padding-top: 20px; }
  .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 36px; }
  .topo-logo { height: 34px; width: auto; object-fit: contain; }
  .topo-rotulo { font-size: 12px; letter-spacing: 0.04em; color: var(--v3-muted); text-align: right; font-variant-numeric: tabular-nums; }
  .progresso { display: flex; gap: 6px; padding-top: 16px; }
  .progresso[hidden] { display: none; }
  .trecho { flex: 1; height: 3px; border-radius: 9999px; background: var(--v3-line); overflow: hidden; }
  .trecho > span { display: block; height: 100%; width: 0; border-radius: 9999px; background: var(--v3-gold); transition: width 0.5s var(--v3-ease); }
  @media (min-width: 640px) {
    .topo { padding-top: 24px; }
    .topo-logo { height: 40px; }
    .topo-rotulo { font-size: 13px; }
  }

  .miolo {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: calc(720px + 2rem);
    margin: 0 auto;
    padding-top: 36px;
    padding-bottom: 20px;
  }
  @media (min-width: 640px) {
    .miolo { max-width: calc(720px + 4rem); padding-top: 56px; padding-bottom: 28px; }
  }
  @media (max-width: 639.98px) {
    .miolo.com-barra { padding-bottom: calc(7rem + env(safe-area-inset-bottom)); }
  }

  .tela { display: flex; flex-direction: column; flex: 1; }
  .tela.entra { animation: entra 0.32s var(--v3-ease); }
  .tela.sai { opacity: 0; transform: translateY(-8px); transition: opacity 0.18s var(--v3-ease), transform 0.18s var(--v3-ease); }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); } }
  .tela h1:focus, .tela h2:focus { outline: none; }

  /* Abertura e fim */
  .intro { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 16px 0; }
  .intro .lead { max-width: 640px; }
  .intro .apoio { max-width: 600px; }
  .acao { padding-top: 8px; }
  .acao .v3-btn { width: 100%; }
  @media (min-width: 640px) {
    .intro { gap: 28px; padding: 32px 0; }
    .acao .v3-btn { width: auto; min-width: 240px; }
  }
  .seta { width: 16px; height: 16px; flex-shrink: 0; }

  /* Pergunta */
  .pergunta { display: flex; flex-direction: column; gap: 28px; }
  .cabeca { display: flex; flex-direction: column; gap: 16px; }
  .cabeca .v3-context { max-width: 640px; }
  .rotulo-linha { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .contador { flex-shrink: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--v3-muted-2); transition: color 0.2s ease; font-variant-numeric: tabular-nums; }
  .contador.cheio { color: var(--v3-gold); }
  @media (max-width: 639.98px) { .contador { display: none; } } /* no celular o contador vai no botão fixo */
  .titulo-pergunta { text-wrap: balance; }
  @media (min-width: 640px) {
    .pergunta { gap: 32px; }
    .cabeca { gap: 18px; }
  }

  .opcoes { display: flex; flex-direction: column; gap: 10px; }
  .opcoes > * { animation: cartao 0.28s var(--v3-ease) backwards; }
  @keyframes cartao { from { opacity: 0; transform: translateY(8px); } }
  .opcao {
    display: flex; width: 100%; min-height: 56px; align-items: center; gap: 16px;
    padding: 14px 16px; text-align: left; font-size: 15px; line-height: 1.375;
  }
  .opcao .texto { flex: 1; min-width: 0; }
  @media (min-width: 640px) {
    .opcao { padding: 14px 20px; font-size: 16px; }
  }
  /* Várias respostas: chips em linha no computador */
  .opcoes.chips .opcao { min-height: 48px; gap: 12px; padding: 12px 16px; font-size: 15px; border-radius: 12px; }
  @media (min-width: 640px) {
    .opcoes.chips { flex-direction: row; flex-wrap: wrap; }
    .opcoes.chips .opcao { width: auto; }
  }
  .v3-check svg { width: 14px; height: 14px; }

  /* Contato */
  .campos { display: flex; flex-direction: column; gap: 20px; }
  .campo { display: flex; flex-direction: column; gap: 8px; }
  .campo label { font-size: 14px; font-weight: 500; color: var(--v3-muted); }
  .erro { margin: 0; font-size: 14px; line-height: 1.45; color: var(--v3-gold-strong); }
  .erro[hidden] { display: none; }
  .consentimento { display: flex; flex-direction: column; gap: 4px; }
  .consente-linha { display: flex; align-items: flex-start; gap: 0; }
  .consente-linha input {
    flex-shrink: 0; width: 22px; height: 22px; margin: 13px 0 0; accent-color: var(--v3-gold); cursor: pointer;
  }
  .consente-linha input:focus-visible { outline: 2px solid var(--v3-gold); outline-offset: 2px; }
  .consente-linha input[aria-invalid="true"] { outline: 1px solid var(--v3-gold-strong); outline-offset: 1px; }
  .consente-linha label {
    flex: 1; min-height: 48px; padding: 12px 0 12px 12px; margin-left: -34px; padding-left: 46px;
    font-size: 15px; line-height: 1.5; color: var(--v3-body); cursor: pointer;
  }

  /* Rodapé */
  .rodape { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 40px; min-height: 48px; }
  .rodape .v3-back svg { width: 16px; height: 16px; }
  .rodape .nota { display: none; font-size: 13px; color: var(--v3-muted-2); }
  .rodape .continuar-pc { display: none; }
  @media (min-width: 640px) {
    .rodape { padding-top: 48px; }
    .rodape .nota { display: block; }
    .rodape .continuar-pc { display: inline-flex; }
    .rodape.tem-continuar .nota { display: none; }
  }
  .v3-fixed-bar[hidden] { display: none; }
  .v3-fixed-bar .v3-btn { width: 100%; }
  .v3-fixed-bar .conta { font-weight: 500; opacity: 0.7; }
  @media (min-width: 640px) { .v3-fixed-bar { display: none; } }

  /* Espera */
  .espera { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 16px 0; }
  .barra-envio { display: flex; align-items: center; gap: 14px; }
  .trilho { flex: 1; height: 6px; border-radius: 9999px; background: var(--v3-line); overflow: hidden; }
  .trilho > span { display: block; height: 100%; width: 0; border-radius: 9999px; background: var(--v3-gold); }
  .pct { flex-shrink: 0; min-width: 3.2em; text-align: right; font-size: 15px; font-weight: 600; color: var(--v3-gold); font-variant-numeric: tabular-nums; }
  .etapas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .etapas li { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.4; color: var(--v3-muted-2); transition: color 0.25s ease; }
  .etapas .marca { flex-shrink: 0; width: 20px; height: 20px; border-radius: 9999px; border: 1px solid var(--v3-line-2); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background-color 0.25s ease, border-color 0.25s ease; }
  .etapas .marca svg { width: 12px; height: 12px; }
  .etapas li.atual { color: var(--v3-ivory); }
  .etapas li.atual .marca { border-color: var(--v3-gold); box-shadow: inset 0 0 0 4px var(--v3-navy); background: var(--v3-gold); }
  .etapas li.feita { color: var(--v3-muted); }
  .etapas li.feita .marca { background: var(--v3-gold); border-color: var(--v3-gold); color: var(--v3-navy); }
  .falha { display: flex; flex-direction: column; gap: 16px; padding: 18px; border: 1px solid var(--v3-gold-strong); border-radius: 10px; background: var(--v3-surface); }
  .falha[hidden] { display: none; }
  .falha p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--v3-body); }
  .falha .v3-btn { width: 100%; }
  @media (min-width: 640px) { .falha .v3-btn { width: auto; min-width: 240px; align-self: flex-start; } }

  /* Devolutiva (só quando o time liga no painel, ou na prévia) */
  .intro.com-devolutiva { justify-content: flex-start; }
  .devolutiva { margin-top: 20px; padding-top: 28px; border-top: 1px solid var(--v3-line); display: flex; flex-direction: column; }
  .devolutiva .dv-titulo { text-wrap: balance; }
  .secao { margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--v3-line); }
  .secao-tit { margin: 0 0 18px; }
  .secao-tit .num { color: var(--v3-gold); }
  .secao-tit .nome { color: var(--v3-ivory); }
  .dv-etapa { margin: 20px 0 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--v3-ivory); }
  .dv-texto { margin: 10px 0 0; max-width: 640px; font-size: 17px; line-height: 1.7; color: var(--v3-body); }
  .secao-tit + .dv-texto { margin-top: 0; }
  .dv-pontos { list-style: none; margin: 18px 0 0; padding: 0; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
  .dv-pontos li { position: relative; padding-left: 22px; font-size: 17px; line-height: 1.6; color: var(--v3-ivory); }
  .dv-pontos li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 7px; height: 7px; border-radius: 9999px; background: var(--v3-gold); }
  .dv-discretas { margin-top: 28px; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }

<script>
// validação: aberta do disco ou com ?validacao=1 no endereço; nos outros casos, produção
const MODO = (location.protocol === 'file:' || new URLSearchParams(location.search).get('validacao') === '1') ? 'validacao' : 'producao';

/* ======================================================================
   BANCO: todo acesso a dados passa por aqui
   Produção: banco do PCE (pcedash), função diagmentoria_enviar. Validação: fichas locais.
   ====================================================================== */
const SUPABASE_URL = "https://amibetbgzwaayhyxnank.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtaWJldGJnendhYXloeXhuYW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDI0MjgsImV4cCI6MjA5MzU3ODQyOH0.Sg6u0i8FWV2fhuyBfqmLeINqK2Q2RR1G2KqMXB3-Ydw";
let SB = null;
// só a produção fala com o banco; sem sessão guardada (nada vai para o localStorage)
try {
  if (MODO === 'producao' && window.supabase && window.supabase.createClient) {
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  }
} catch (e) { SB = null; }

const BANCO = {
  CHAVE: 'dnm_fichas_locais',
  _falharVezes: 0, // gancho de teste (só file://)
  /* Chave da devolutiva, ligada pelo time no painel. Promise que sempre resolve true/false, nunca rejeita:
     falha, demora de mais de 4 s ou função ausente = false. Em validação, só `&devolutiva=1` liga. */
  config() {
    if (MODO !== 'producao') return Promise.resolve(new URLSearchParams(location.search).get('devolutiva') === '1');
    return new Promise(function (resolve) {
      const relogio = setTimeout(function () { resolve(false); }, 4000);
      const fim = function (v) { clearTimeout(relogio); resolve(v); };
      try {
        if (!SB) { fim(false); return; }
        Promise.resolve(SB.rpc('diagmentoria_config')).then(function (res) {
          fim(!!(res && !res.error && res.data && res.data.devolutiva === true));
        }, function () { fim(false); });
      } catch (e) { fim(false); }
    });
  },
  /* Devolve uma Promise. Em caso de recusa, o erro leva `msgBanco` (a frase do banco para mostrar ao aluno). */
  gravar(ficha) {
    if (MODO === 'producao') {
      if (!SB) return Promise.reject(new Error('O sistema não carregou.'));
      const chamada = SB.rpc('diagmentoria_enviar', {
        p_turma: ficha.turma,
        p_nome: ficha.nome,
        p_email: ficha.email,
        p_telefone: ficha.telefone,
        p_consentiu: ficha.consentiu,
        p_versao: ficha.versao_formulario,
        p_respostas: ficha.respostas,
        p_resultado: ficha
      });
      const limite = new Promise(function (_, nao) { setTimeout(function () { nao(new Error('O envio demorou demais.')); }, 25000); });
      return Promise.race([chamada, limite]).then(function (res) {
        if (res.error) throw new Error(res.error.message || 'falha na chamada');
        if (!res.data || res.data.ok !== true) {
          throw Object.assign(new Error('recusado'), { codigo: res.data && res.data.erro, msgBanco: (res.data && res.data.msg) || '' });
        }
        return res.data;
      });
    }
    if (BANCO._falharVezes > 0) {
      BANCO._falharVezes -= 1;
      return new Promise(function (_, rejeita) { setTimeout(function () { rejeita(new Error('falha simulada')); }, 400); });
    }
    return new Promise(function (resolve) {
      let lista = [];
      try {
        const bruto = localStorage.getItem(BANCO.CHAVE);
        const lido = bruto ? JSON.parse(bruto) : [];
        if (Array.isArray(lido)) lista = lido;
      } catch (e) { lista = []; }
      lista.unshift(ficha);
      try { localStorage.setItem(BANCO.CHAVE, JSON.stringify(lista.slice(0, 20))); } catch (e) { /* sem localStorage: segue sem guardar */ }
      resolve(ficha);
    });
  }
};

/* ======================================================================
   Estado e utilidades
   ====================================================================== */
const P = MOTOR.PERGUNTAS;
const LETRAS = 'ABCDEFGHIJ';
const AVANCO_MS = 350;
const SAIDA_MS = 180;
const TRAVA_MS = 400;   // depois de uma tela nova, ignora o resto de um clique duplo
const ESPERA_MIN_MS = 1500;
const ARQUIVO = location.protocol === 'file:';
const params = new URLSearchParams(location.search);
const limpaTurma = function (t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '').slice(0, 40); };
const TURMA = limpaTurma(params.get('t'));
const MSG_FALHA_ENVIO = 'Não conseguimos gravar as suas respostas. Confira a internet e tente de novo.';
const menosMovimento = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const temMouse = window.matchMedia ? window.matchMedia('(hover: hover)').matches : false;

const SETA = '<svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
const VISTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ETAPAS_ENVIO = ['Conferindo as suas respostas', 'Calculando o momento da sua mentoria', 'Enviando para o nosso time'];

function estadoInicial() {
  return {
    tela: 'abertura',          // abertura | contato | pergunta | espera | fim
    pos: 0,                    // posição na sequência (pergunta)
    contato: { nome: '', email: '', telefone: '', consentiu: false },
    respostas: {},
    ficha: null,
    enviado: false
  };
}
let E = estadoInicial();
let trocando = false;
let renderEm = 0;
let timerAvanco = null;
let envio = { ativo: false, gravando: false, raf: 0, pct: 0, inicio: 0, resolvido: false, falhou: false, congelar: false };

const $ = function (s, r) { return (r || document).querySelector(s); };
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function travado() { return trocando || performance.now() - renderEm < TRAVA_MS; }
function primeiroNome(nome) {
  const limpo = String(nome || '').trim().replace(/^TESTE\s+/, '');
  return limpo.split(/\s+/)[0] || '';
}
function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* segue para a reserva */ }
  const h = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < 36; i++) {
    if (i === 8 || i === 13 || i === 18 || i === 23) s += '-';
    else if (i === 14) s += '4';
    else if (i === 19) s += h[(Math.random() * 4 | 0) + 8];
    else s += h[Math.random() * 16 | 0];
  }
  return s;
}

/* Brilho que segue o mouse e onda no clique */
document.addEventListener('mousemove', function (e) {
  const el = e.target.closest && e.target.closest('.v3-spotlight');
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  el.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });
function onda(e, el) {
  if (menosMovimento.matches || !el) return;
  const r = el.getBoundingClientRect();
  const lado = Math.max(r.width, r.height) * 2;
  let x = e.clientX - r.left, y = e.clientY - r.top;
  if (!e.clientX && !e.clientY) { x = r.width / 2; y = r.height / 2; }
  const s = document.createElement('span');
  s.className = 'v3-ripple';
  s.style.width = s.style.height = lado + 'px';
  s.style.left = (x - lado / 2) + 'px';
  s.style.top = (y - lado / 2) + 'px';
  el.appendChild(s);
  setTimeout(function () { s.remove(); }, 650);
}
function pulsar(el) {
  if (!el) return;
  el.classList.remove('pulsa');
  void el.offsetWidth;
  el.classList.add('pulsa');
}

/* ======================================================================
   Navegação entre telas
   ====================================================================== */
function irPara(mudanca) {
  clearTimeout(timerAvanco);
  timerAvanco = null;
  Object.assign(E, mudanca);
  const tela = $('#tela');
  if (menosMovimento.matches || !tela.firstChild) { render(); return; }
  trocando = true;
  tela.classList.remove('entra');
  tela.classList.add('sai');
  setTimeout(function () {
    tela.classList.remove('sai');
    render();
    trocando = false;
  }, SAIDA_MS);
}

function render() {
  const tela = $('#tela');
  let html = '';
  if (E.tela === 'abertura') html = telaAbertura();
  else if (E.tela === 'contato') html = telaContato();
  else if (E.tela === 'pergunta') html = telaPergunta();
  else if (E.tela === 'espera') html = telaEspera();
  else if (E.tela === 'fim') html = telaFim();
  tela.innerHTML = html;
  tela.classList.remove('entra');
  void tela.offsetWidth;
  if (!menosMovimento.matches) tela.classList.add('entra');
  renderEm = performance.now();
  atualizarTopo();
  atualizarRodape();
  window.scrollTo(0, 0);
  ligarTela();
  const foco = tela.querySelector('[data-foco]');
  if (foco) { try { foco.focus({ preventScroll: true }); } catch (e) { foco.focus(); } }
}

function atualizarTopo() {
  const rot = $('#rotulo-topo');
  const prog = $('#progresso');
  const trechos = prog.querySelectorAll('.trecho > span');
  let fill = [0, 0, 0, 0];
  let texto = '';
  let mostra = true;
  if (E.tela === 'abertura' || E.tela === 'fim') { mostra = false; }
  else if (E.tela === 'contato') { texto = 'Contato'; }
  else if (E.tela === 'pergunta') {
    const seq = MOTOR.sequencia(E.respostas);
    const id = seq[E.pos];
    const b = P[id].bloco;
    const n = posNoBloco(seq, E.pos);
    fill = [1, 0, 0, 0];
    for (let i = 0; i < b; i++) fill[i + 1] = 1;
    fill[b + 1] = (n - 1) / 5;
    texto = (E.pos + 1) + ' de ' + seq.length;
  } else if (E.tela === 'espera') { fill = [1, 1, 1, 1]; texto = 'Enviando'; }
  rot.textContent = texto;
  prog.hidden = !mostra;
  trechos.forEach(function (t, i) { t.style.width = Math.round(fill[i] * 100) + '%'; });
  const total = Math.round((fill[0] * 1 + (fill[1] + fill[2] + fill[3]) * 5) / 16 * 100);
  prog.setAttribute('aria-valuenow', String(total));
}

function posNoBloco(seq, pos) {
  const b = P[seq[pos]].bloco;
  let n = 0;
  for (let i = 0; i <= pos; i++) if (P[seq[i]].bloco === b) n++;
  return n;
}

function atualizarRodape() {
  const voltar = $('#voltar');
  const rodape = $('#rodape');
  const btnPc = $('#continuar-pc');
  const barra = $('#barra-fixa');
  const miolo = $('#miolo');
  let mostraVoltar = E.tela === 'contato' || E.tela === 'pergunta' || (E.tela === 'espera' && envio.falhou);
  voltar.hidden = !mostraVoltar;
  $('#rodape-esq').hidden = mostraVoltar;
  const varias = E.tela === 'pergunta' && P[MOTOR.sequencia(E.respostas)[E.pos]].tipo === 'varias';
  btnPc.hidden = !varias;
  rodape.classList.toggle('tem-continuar', varias);
  barra.hidden = !varias;
  miolo.classList.toggle('com-barra', varias);
  if (varias) atualizarContinuar();
}

   ====================================================================== */

/* ======================================================================
   Tela 2 · Contato

function mascaraTelefone(v) {
  const d = String(v).replace(/\D/g, '').slice(0, 11);
  if (!d) return '';
  if (d.length <= 2) return '(' + d;
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
function campo(id, rotulo, valor, extra, erro) {
  return '<div class="campo">' +
    '<label for="' + id + '">' + rotulo + '</label>' +
    '<input class="v3-input" id="' + id + '" name="' + id + '" value="' + esc(valor) + '" aria-describedby="' + id + '-erro" ' + extra + '>' +
    '<p class="erro" id="' + id + '-erro" hidden>' + erro + '</p>' +
    '</div>';
}
function telaContato() {
  const c = E.contato;
  return '<form class="pergunta" id="form-contato" novalidate>' +
    '<div class="cabeca">' +
      '<p class="v3-eyebrow">Antes de começar</p>' +
      '<h2 class="v3-title titulo-pergunta" tabindex="-1" data-foco>Como podemos chamar e encontrar você?</h2>' +
    '</div>' +
    '<div class="campos">' +

/* Chave da devolutiva: pedida uma vez por página, durante a espera. Nunca segura a gravação. */
const CHAVE = { promessa: null, valor: false };
function pedirChave() {
  if (!CHAVE.promessa) {
    CHAVE.promessa = BANCO.config().then(function (v) { CHAVE.valor = v === true; return CHAVE.valor; }, function () { CHAVE.valor = false; return false; });
  }
  return CHAVE.promessa;
}

function iniciarEnvio(congelar) {
  pararEnvio();
  if (!congelar) pedirChave();
  envio = { ativo: true, gravando: false, raf: 0, pct: 0, inicio: performance.now(), resolvido: false, falhou: false, congelar: !!congelar, fechadoEm: 0 };
  pintarEnvio(0);
  if (!congelar) gravarAgora();
  envio.raf = requestAnimationFrame(passoEnvio);
}

function gravarAgora() {
  if (envio.gravando || E.enviado) return;
  envio.gravando = true;
  if (!E.ficha) {
    try { E.ficha = montarFicha(); }
    catch (err) { envio.gravando = false; mostrarFalha(); return; }
  }
  BANCO.gravar(E.ficha).then(function (res) {
    envio.gravando = false;
    envio.resolvido = true;
    E.enviado = true;
    E.retornoBanco = res || null;
  }, function (err) {
    envio.gravando = false;
    mostrarFalha(err && err.msgBanco);
  });
}

function mostrarFalha(msgBanco) {
  envio.falhou = true;
  pararEnvio();
  const f = $('#falha');
  const m = $('#falha-msg');
  if (m) m.textContent = msgBanco || MSG_FALHA_ENVIO;
  if (f) f.hidden = false;
  atualizarRodape();
}

function passoEnvio(agora) {
  if (!envio.ativo) return;
  const t = agora - envio.inicio;
  let alvo;
  if (envio.congelar) alvo = Math.min(58, 96 * (1 - Math.exp(-t / 500)));
  else if (envio.resolvido && t >= ESPERA_MIN_MS) alvo = 100;
  else alvo = Math.min(96, 96 * (1 - Math.exp(-t / 520)));
  let pct = envio.pct + (alvo - envio.pct) * (alvo === 100 ? 0.2 : 1);
  if (alvo === 100 && 100 - pct < 0.6) pct = 100;
  envio.pct = Math.max(envio.pct, pct);
  pintarEnvio(envio.pct);
  if (envio.pct >= 100) {
    envio.ativo = false;
    setTimeout(function () {
      (CHAVE.promessa || Promise.resolve(false)).then(function () { if (E.tela === 'espera' && E.enviado) irPara({ tela: 'fim' }); });
    }, 380);
    return;
  }
  envio.raf = requestAnimationFrame(passoEnvio);
}

function pintarEnvio(pct) {
  const barra = $('#barra-envio');
  if (!barra) return;
  const p = Math.round(pct);
  barra.style.width = pct + '%';
  $('#pct').textContent = p + '%';
  $('#trilho').setAttribute('aria-valuenow', String(p));
  const atual = pct >= 100 ? 3 : pct < 34 ? 0 : pct < 67 ? 1 : 2;
  document.querySelectorAll('#etapas li').forEach(function (li, i) {
    li.classList.toggle('feita', i < atual);

  const tit = $('#etapa-envio');
  const texto = ETAPAS_ENVIO[Math.min(atual, 2)];
  if (tit.textContent !== texto) tit.textContent = texto;
}

/* ---------- PDF da devolutiva: nada aqui toca na gravação da ficha ---------- */
const PDF_ETAPAS = ['Preparando o gerador', 'Montando a página', 'Baixando o arquivo'];
const BAIXAR_SVG = '<svg class="pdf-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>';
let pdfTrabalho = null; // { onde, raf, pct, alvo, inicio, etapa }
function htmlBotaoPdf(onde) {
  if (!window.DEM_PDF) return '';
  return '<div class="pdf-bloco" data-pdf="' + onde + '">' +
    '<button type="button" class="btn-contorno pdf-botao">Baixar devolutiva em PDF ' + BAIXAR_SVG + '</button>' +
    '<div class="pdf-prog" hidden>' +
      '<p class="pdf-etapa" aria-live="polite">' + PDF_ETAPAS[0] + '</p>' +
      '<div class="barra-envio"><div class="trilho" role="progressbar" aria-label="Geração do PDF" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div><span class="pct">0%</span></div>' +
    '</div>' +
    '<p class="pdf-msg" role="status" hidden></p>' +
    '<div class="pdf-interno" hidden></div>' +
    '</div>';
}
function pintarPdf(bloco, pct) {
  const p = Math.round(pct);
  bloco.querySelector('.trilho > span').style.width = pct + '%';
  bloco.querySelector('.pct').textContent = p + '%';
  bloco.querySelector('.trilho').setAttribute('aria-valuenow', String(p));
  const etapa = PDF_ETAPAS[pdfTrabalho ? pdfTrabalho.etapa : 0];
  const el = bloco.querySelector('.pdf-etapa');
  if (el.textContent !== etapa) el.textContent = etapa;
}
function passoPdf(agora) {
  const w = pdfTrabalho;
  if (!w || w.fechado) return;
  // o gerador avisa 8, 40 e 55 a 95; entre um aviso e outro a barra anda devagar, sem passar de 96%
  const teto = [36, 52, 96][w.etapa];
  const creep = w.base + (teto - w.base) * (1 - Math.exp(-(agora - w.desde) / 2500));
  const alvo = Math.min(96, Math.max(w.alvo, creep));
  w.pct = Math.max(w.pct, w.pct + (alvo - w.pct) * 0.18);
  pintarPdf(w.bloco, w.pct);
  w.raf = requestAnimationFrame(passoPdf);
}
function avisoPdf(texto, pct) {
  const w = pdfTrabalho;
  if (!w || w.fechado || typeof pct !== 'number') return;
  const etapa = pct >= 55 ? 2 : pct >= 40 ? 1 : 0;
  if (etapa > w.etapa) { w.etapa = etapa; w.base = w.pct; w.desde = performance.now(); }
  w.alvo = Math.min(96, Math.max(w.alvo, pct));
}
function blocosPdf() { return document.querySelectorAll('.pdf-bloco'); }
function linkDaPagina() {
  const u = new URL(location.href);
  u.hash = '';
  return u.href;
}
function baixarPdf(bloco) {
  if (pdfTrabalho) return; // clique duplo, ou o outro botão durante a geração: uma vez só
  blocosPdf().forEach(function (b) {
    b.querySelector('.pdf-msg').hidden = true;
    b.querySelector('.pdf-interno').hidden = true;
  });
  let interno = false;
  try { interno = !!(window.DEM_PDF && DEM_PDF.navegadorInterno()); } catch (e) { interno = false; }
  if (interno) {
    const caixa = bloco.querySelector('.pdf-interno');
    const link = linkDaPagina();
    caixa.innerHTML = '<p>Para baixar o PDF, abra este link no navegador do celular.</p>' +
      '<a class="pdf-link" href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a>' +
      '<button type="button" class="btn-texto pdf-copiar">Copiar link</button>';
    caixa.hidden = false;
    caixa.querySelector('.pdf-copiar').addEventListener('click', function (e) { copiarLink(link, e.currentTarget); });
    return;
  }
  pdfTrabalho = { bloco: bloco, pct: 0, alvo: 0, etapa: 0, base: 0, desde: performance.now(), raf: 0, fechado: false };
  blocosPdf().forEach(function (b) { b.querySelector('.pdf-botao').disabled = true; });
  const prog = bloco.querySelector('.pdf-prog');
  prog.hidden = false;
  pintarPdf(bloco, 0);
  pdfTrabalho.raf = requestAnimationFrame(passoPdf);
  let promessa;
  try {
    promessa = Promise.resolve(DEM_PDF.baixar(respostasDoCaminho(), E.contato.nome, { tema: 'claro', aviso: avisoPdf }));
  } catch (e) { promessa = Promise.reject(e); }
  promessa.then(function () { fecharPdf(true); }, function () { fecharPdf(false); });
}
function fecharPdf(deuCerto) {
  const w = pdfTrabalho;
  if (!w) return;
  w.fechado = true;
  cancelAnimationFrame(w.raf);
  const terminar = function () {
    if (!document.body.contains(w.bloco)) { pdfTrabalho = null; return; }
    w.bloco.querySelector('.pdf-prog').hidden = true;
    const msg = w.bloco.querySelector('.pdf-msg');
    msg.textContent = deuCerto ? 'PDF baixado.' : 'Não conseguimos gerar o PDF. Tente de novo.';
    msg.classList.toggle('erro-pdf', !deuCerto);
    msg.hidden = false;
    blocosPdf().forEach(function (b) { b.querySelector('.pdf-botao').disabled = false; });
    pdfTrabalho = null;
  };
  if (deuCerto) {
    pdfTrabalho.etapa = 2;
    pintarPdf(w.bloco, 100);
    setTimeout(terminar, 450);
  } else {
    terminar();
  }
}
function copiarLink(link, botao) {
  const feito = function () { botao.textContent = 'Link copiado'; };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(feito, function () { if (copiarAntigo(link)) feito(); });
      return;
    }
  } catch (e) { /* segue para o jeito antigo */ }
  if (copiarAntigo(link)) feito();
}
function copiarAntigo(link) {
  try {
    const t = document.createElement('textarea');
    t.value = link; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch (e) { return false; }
}

function telaFim() {
  const nome = primeiroNome(E.contato.nome);
  const devolutiva = (PREVIA || CHAVE.valor) ? htmlDevolutiva() : '';
  let h = '<div class="intro' + (devolutiva ? ' com-devolutiva' : '') + '">' +
    '<p class="v3-eyebrow">Diagnóstico concluído</p>' +
    '<h1 class="v3-display" tabindex="-1" data-foco>Obrigado' + (nome ? ', ' + esc(nome) : '') + '.</h1>' +
    '<div class="v3-rule" aria-hidden="true"></div>' +
    '<p class="v3-lead lead">Recebemos as suas respostas.</p>' +
    (devolutiva || '<p class="v3-context apoio">Elas já estão com o nosso time e preparam a sua conversa individual.</p>');
  if (MODO === 'validacao' && !PREVIA) {
    h += '<div class="area-validacao">' +
      '<p class="rotulo-validacao">Só na versão de validação</p>' +
      '<div class="botoes">' +
        '<button type="button" id="ver-ficha" class="btn-contorno">Ver a ficha que o time recebe ' + SETA + '</button>' +
        '<button type="button" id="responder-de-novo" class="btn-texto">Responder de novo</button>' +
      '</div></div>';
  }
  return h + '</div>';
}

/* ======================================================================
   Eventos de cada tela
   ====================================================================== */
function ligarTela() {
  if (E.tela === 'abertura') {
    $('#comecar').addEventListener('click', function (e) {
      if (travado()) return;
      onda(e, e.currentTarget);
      irPara({ tela: 'contato' });
    });
  } else if (E.tela === 'contato') {
    const form = $('#form-contato');
    const tel = $('#telefone');
    tel.addEventListener('input', function () { tel.value = mascaraTelefone(tel.value); });
    ['nome', 'email', 'telefone', 'consentiu'].forEach(function (k) {
      $('#' + k).addEventListener(k === 'consentiu' ? 'change' : 'input', function () {
        E.contato[k] = k === 'consentiu' ? $('#consentiu').checked : $('#' + k).value;
        if ($('#' + k).getAttribute('aria-invalid') === 'true') {
          $('#' + k).setAttribute('aria-invalid', 'false');
          $('#' + k + '-erro').hidden = true;
        }
      });
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (travado()) return;
      const v = validarContato(true);
      if (!v.ok) {
        const primeiro = ['nome', 'email', 'telefone', 'consentiu'].filter(function (k) { return v.erros[k]; })[0];
        $('#' + primeiro).focus();
        return;
      }
      E.contato = v.dados;
      irPara({ tela: 'pergunta', pos: 0 });
    });
    form.querySelector('button[type="submit"]').addEventListener('click', function (e) { onda(e, e.currentTarget); });
    if (GANCHO_ERRO) validarContato(true);
    if (temMouse && !ARQUIVO_GANCHO) { try { $('#nome').focus({ preventScroll: true }); } catch (err) { /* sem foco */ } }
  } else if (E.tela === 'pergunta') {
    const a = perguntaAtual();
    document.querySelectorAll('.opcao').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (travado()) return;
        const i = Number(b.dataset.i);
        if (a.q.tipo === 'uma') escolherUma(i, b, e);
        else marcarVarias(i, b, e);
      });
    });
    if (a.q.tipo === 'varias') pintarVarias();
  } else if (E.tela === 'espera') {
    $('#enviar-de-novo').addEventListener('click', function (e) {
      if (envio.gravando || E.enviado) return;
      onda(e, e.currentTarget);
      $('#falha').hidden = true;
      envio.falhou = false;
      envio.ativo = true;
      envio.inicio = performance.now() - 300;
      atualizarRodape();
      gravarAgora();
      envio.raf = requestAnimationFrame(passoEnvio);
    });
    iniciarEnvio(GANCHO_CONGELAR);
  } else if (E.tela === 'fim') {
    blocosPdf().forEach(function (b) {
      b.querySelector('.pdf-botao').addEventListener('click', function () { baixarPdf(b); });
    });
    const ver = $('#ver-ficha');
    if (ver) ver.addEventListener('click', function () {
      const w = window.open('diagnostico-mentoria-painel.html#ultima', '_blank', 'noopener');
      if (!w) location.href = 'diagnostico-mentoria-painel.html#ultima';
    });
    const de = $('#responder-de-novo');
    if (de) de.addEventListener('click', function () {
      if (travado()) return;
      pararEnvio();
      irPara(estadoInicial());
    });
  }
}

function continuarVarias(e) {
  if (travado() || E.tela !== 'pergunta') return;
  const a = perguntaAtual();
  if (a.q.tipo !== 'varias' || !MOTOR.respondida(a.id, E.respostas)) return;
  onda(e, e.currentTarget);
  avancar();
}
$('#continuar-pc').addEventListener('click', continuarVarias);
$('#continuar-cel').addEventListener('click', continuarVarias);
$('#voltar').addEventListener('click', function () { if (!travado()) voltar(); });

/* ======================================================================
   Gancho de teste (só abrindo do disco): ?tela=contato · ?tela=pergunta:{id}[&marcar=0,1]
   · ?tela=espera · ?tela=fim:{0|1|2} · ?falhar=1 (a primeira gravação falha)
   ====================================================================== */
let ARQUIVO_GANCHO = false;
let GANCHO_CONGELAR = false;
let GANCHO_ERRO = false;
/* Prévia para o time: ?previa=devolutiva[:0|1|2] abre a tela final com a devolutiva, com um exemplo do motor, sem gravar nada */
let PREVIA = false;
(function previa() {
  const m = /^devolutiva(?::(\d))?$/.exec(params.get('previa') || '');
  if (!m) return;
  const x = MOTOR.EXEMPLOS[Number(m[1] || 0)] || MOTOR.EXEMPLOS[0];
  PREVIA = true;
  E.contato = Object.assign({}, x.contato);
  E.respostas = JSON.parse(JSON.stringify(x.respostas));
  E.tela = 'fim';
})();
(function gancho() {
  if (!ARQUIVO || PREVIA) return;
  const pedido = params.get('tela');
  if (params.get('falhar') === '1') BANCO._falharVezes = 1;
  if (!pedido) return;
  ARQUIVO_GANCHO = true;
  const ex = MOTOR.EXEMPLOS;
  if (pedido === 'contato') { E.tela = 'contato'; GANCHO_ERRO = params.get('erro') === '1'; return; }
  if (pedido === 'espera') {
    E.contato = Object.assign({}, ex[0].contato);
    E.respostas = JSON.parse(JSON.stringify(ex[0].respostas));
    E.tela = 'espera';
    GANCHO_CONGELAR = true;
    return;
  }
  if (pedido.indexOf('fim:') === 0) {
    const k = Number(pedido.slice(4));
    const x = ex[k] || ex[0];
    E.contato = Object.assign({}, x.contato);
    E.respostas = JSON.parse(JSON.stringify(x.respostas));
    E.tela = 'fim';
    return;
  }
  if (pedido.indexOf('pergunta:') === 0) {
    const id = pedido.slice(9);
    if (!P[id]) return;
    const x = MOTOR.RAMOS.nv.indexOf(id) !== -1 ? ex[1] : ex[0];
    const seq = MOTOR.sequencia(x.respostas);
    const pos = seq.indexOf(id);
    E.contato = Object.assign({}, x.contato);
    for (let i = 0; i < pos; i++) E.respostas[seq[i]] = JSON.parse(JSON.stringify(x.respostas[seq[i]]));
    const marcar = params.get('marcar');
    if (marcar !== null && marcar !== '') {
      const lista = marcar.split(',').map(Number).filter(function (n) { return n >= 0 && n < P[id].opcoes.length; });
      E.respostas[id] = P[id].tipo === 'uma' ? lista[0] : lista;
    }
    E.tela = 'pergunta';
    E.pos = pos;
  }
})();

if (PREVIA) { $('#faixa').textContent = 'PRÉVIA · é assim que o aluno vê quando a devolutiva está ligada'; $('#faixa').hidden = false; }
else if (MODO === 'validacao') $('#faixa').hidden = false;
// validação: &devolutiva=1 força a devolutiva ligada (também nos ganchos de teste)
if (MODO === 'validacao') CHAVE.valor = params.get('devolutiva') === '1';
render();
</script>
