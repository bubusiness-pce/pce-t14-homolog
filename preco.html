<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>[HOMOLOG] Precificação · Mentor de Líderes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Uma coluna, primeiro o celular. Visual de relatório de consultoria: navy, marfim e dourado (padrão premium de 27/10). */
:root{
  color-scheme:dark;
  --bg:#0B1426; --s1:#111C33; --s2:#16223D; --ln:#24304A; --ln2:#2A3654;
  --ivory:#F3EEE3; --tx:#DCD6CA; --mu:#B8BFCC; --mu2:#8E97A8;
  --gold:#D9B872; --gold2:#C9A45C; --warn:#E6B566;
  --display:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --p-ink:#0B1426; --p-tx:#2B3445; --p-mu:#6B7280; --p-ln:#E4DED1; --p-soft:#F7F4ED; --p-gold:#8C6A2B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit}
.faixa{background:#1A2440;color:var(--gold);text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ln)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 150px}
.tela{animation:entra .32s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500}
.titulo{font-family:var(--display);font-weight:500;font-size:clamp(36px,7.5vw,54px);line-height:1.06;color:var(--ivory);text-wrap:balance;margin:.35em 0 .3em}
.enunciado{font-family:var(--display);font-weight:500;font-size:clamp(29px,5.8vw,40px);line-height:1.1;color:var(--ivory);text-wrap:balance;margin:.3em 0 .25em}
.contexto{color:var(--mu);font-size:15px;max-width:62ch;margin:0}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.voltar{background:none;border:none;color:var(--mu);cursor:pointer;padding:8px 0;font-size:14px}
.voltar:hover{color:var(--ivory)}
.prog{height:3px;background:var(--ln);border-radius:2px;overflow:hidden;margin:8px 0 26px}
.prog>i{display:block;height:100%;background:var(--gold);transition:width .45s ease}
.opcoes{display:grid;gap:10px;margin-top:24px}
.op,.serv{position:relative;overflow:hidden;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln2);border-radius:14px;color:var(--ivory);cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
.op{display:flex;gap:14px;align-items:flex-start;padding:16px;min-height:60px}
.op .letra{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold2);color:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:600;transition:background .2s,color .2s}
.op .t{display:block;font-weight:500;font-size:16px;color:var(--ivory)}
.op .d{display:block;font-size:14px;color:var(--mu);margin-top:2px}
.op.sel,.serv.sel{border-color:var(--gold);background:var(--s2)}
.op.sel .letra{background:var(--gold);color:var(--bg)}
@media (min-width:640px){.opcoes.duas{grid-template-columns:1fr 1fr}}
@media (hover:hover){
  .op:hover,.serv:hover{transform:translateY(-2px);border-color:var(--gold2)}
  .op::before,.serv::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(217,184,114,.11),transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
  .op:hover::before,.serv:hover::before{opacity:1}
}
.op:active,.serv:active{transform:scale(.98)}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(217,184,114,.42);pointer-events:none;animation:rp .6s ease-out forwards}
@keyframes rp{to{transform:scale(32);opacity:0}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rot{display:block;font-size:13px;color:var(--mu);margin:18px 0 6px}
.rot span{color:var(--mu2)}
.campo{background:var(--s1);border:1px solid var(--ln2);color:var(--ivory);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;width:100%;min-height:48px}
.campo:focus{border-color:var(--gold);outline:none}
.campo::placeholder{color:#5F6A80}
.moeda{position:relative}
.moeda>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:16px;pointer-events:none}
.moeda>.campo{padding-left:44px;font-variant-numeric:tabular-nums}
.moeda.grande>.campo{font-family:var(--display);font-size:30px;min-height:64px;padding-left:56px}
.moeda.grande>span{font-size:22px;left:18px}
.outro-box{display:flex;gap:10px;align-items:center;margin-top:12px}
.outro-box>.moeda,.outro-box>.campo{flex:1;min-width:0}
.outro-box .btn{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--s1);border:1px solid var(--ln2);color:var(--ivory);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--gold2)}
.chip.sel{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.linha-t{margin-top:22px}
.linha-t .rot{margin-top:0}
.total-vivo{margin-top:22px;padding:14px 16px;border:1px solid var(--ln2);border-radius:12px;background:var(--s1);color:var(--tx);font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total-vivo b{font-family:var(--display);font-size:26px;font-weight:500;color:var(--gold)}
.erro{color:var(--warn);font-size:14px;margin:10px 0 0;min-height:1.2em}
/* v7: o que o cliente recebe (campos que abrem sob o cartão) e a linha do pacote na devolutiva */
.sub-r{margin:0 0 6px 34px;padding:2px 0 6px}
.sub-r .rot{margin-top:0}
.sub-r .chips{margin-top:8px}
.sub-r .outro-box{margin-top:10px}
.pacote{margin:14px 2px 0;font-size:14px;line-height:1.5;color:var(--mu)}
.pacote b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);font-weight:500;margin-bottom:3px}
.pg .pacote{font-size:12px;color:var(--p-mu);margin-top:10px}
.pg .pacote b{color:var(--p-mu)}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,20,38,.97);border-top:1px solid var(--ln);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.barra .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.barra .info{font-size:13px;color:var(--mu);flex:1;min-width:0}
.btn{background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:14px 22px;min-height:50px;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:#E4C788}
.btn.lg{width:100%;margin-top:26px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.btn.ghost:hover{background:rgba(217,184,114,.08)}
.btn.sm{min-height:44px;padding:10px 16px;font-size:15px}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);margin:26px 0 10px}
.lista-serv{display:grid;gap:8px}
.serv{display:flex;gap:12px;align-items:flex-start;padding:13px 14px}
.serv .cx{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--gold2);margin-top:2px;display:grid;place-items:center;color:var(--bg);font-size:14px;font-weight:700}
.serv.sel .cx{background:var(--gold)}
.serv .txt{flex:1;min-width:0}
.serv .t{display:block;font-size:15px;font-weight:500;color:var(--ivory)}
.serv .d{display:block;font-size:13px;color:var(--mu)}
.serv .pr{flex:none;text-align:right;font-size:13px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.serv .pr small{display:block;color:var(--mu2);font-size:11px}
.qtd{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--tx)}
.qtd button{width:34px;height:34px;border-radius:8px;border:1px solid var(--gold2);background:transparent;color:var(--gold);cursor:pointer;font-size:18px;line-height:1}
.qtd b{min-width:22px;text-align:center;font-weight:600;color:var(--ivory)}
.seu-mercado{background:var(--s1);border:1px dashed var(--gold2);border-radius:14px;padding:14px}
.seu-mercado p{margin:0 0 4px;font-size:14px;color:var(--tx)}
.seu-mercado p small{color:var(--mu2);font-size:13px}
.outro{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center;margin-top:8px}
.outro.g{grid-template-columns:minmax(0,1fr) 140px 130px auto}
.outro select{background:var(--bg);border:1px solid var(--ln2);color:var(--ivory);border-radius:12px;min-height:48px;padding:0 10px;font:inherit;font-size:14px}
.x{background:none;border:1px solid var(--ln2);color:var(--mu);border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:18px}
.mais{margin-top:10px;background:none;border:1px dashed var(--gold2);color:var(--gold);border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;width:100%}
details.extra{margin-top:22px;border-top:1px solid var(--ln);padding-top:12px}
details.extra summary{cursor:pointer;color:var(--mu);font-size:14px;padding:6px 0}
.so-eu{margin-top:18px}
@media (max-width:560px){.outro,.outro.g{grid-template-columns:minmax(0,1fr) auto}.outro .campo.nome{grid-column:1/-1}.outro.g select{grid-column:1/2}}
/* Bloco B: o que você já construiu */
.fatos{display:grid;gap:10px;margin-top:22px}
.fato{background:var(--s1);border:1px solid var(--ln2);border-radius:14px;padding:12px 14px;transition:border-color .2s}
.fato.ok{border-color:var(--gold2)}
.fato .ft{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fato .ft b{font-size:15px;font-weight:600;color:var(--ivory)}
.fato .fd{font-size:13px;color:var(--mu);margin:2px 0 0}
.fato .chips{margin-top:10px}
.fato .chip{min-height:40px;padding:8px 14px;font-size:14px}
.barra .info b{color:var(--gold);font-weight:600}
/* Devolutiva */
.frase{background:var(--s1);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:12px 16px;font-size:16px;line-height:1.5;color:var(--ivory);font-style:italic}
.frase small{display:block;font-style:normal;color:var(--mu2);font-size:12px;margin-top:8px}
details.conta{margin-top:44px;border-top:1px solid var(--ln);padding-top:6px}
details.conta>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:12px 0}
details.conta>summary::-webkit-details-marker{display:none}
details.conta>summary .sec-t{font-size:22px;color:var(--mu)}
details.conta[open]>summary .sec-t{color:var(--ivory)}
details.conta .sec{margin-top:28px}
.sub-t{font-family:var(--display);color:var(--ivory);font-size:22px;font-weight:500;margin:0 0 10px}
.cab .sub{color:var(--mu);font-size:15px;margin:0}
.aviso-ex{margin-top:16px;font-size:14px;color:var(--tx);background:var(--s1);border:1px solid var(--ln2);border-radius:12px;padding:12px 14px}
.sec{margin-top:40px}
.sec-h{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:16px}
.sec-n{font-family:var(--display);color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.sec-t{font-family:var(--display);color:var(--ivory);font-size:26px;font-weight:500;line-height:1.15;margin:0}
.sec-d{color:var(--mu);font-size:14px;margin:-6px 0 14px}
.regua{margin-top:14px;background:var(--s1);border:1px solid var(--ln2);border-radius:14px;padding:14px 16px}
.rr{margin:12px 0}
.rr .lb{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--tx)}
.rr .lb span:last-child{color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.rr.dentro .lb span:first-child{color:var(--gold)}
.trk{position:relative;height:10px;background:var(--bg);border-radius:5px;margin-top:6px}
.seg{position:absolute;top:0;bottom:0;background:var(--ln2);border-radius:5px;min-width:6px}
.rr.dentro .seg{background:var(--gold2)}
.tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--gold);margin-left:-1px;border-radius:1px}
.rr.voce .trk{background:transparent;border-top:1px dashed var(--ln2);border-radius:0;height:14px;margin-top:10px}
.dot{position:absolute;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%}
.dot.sug{background:var(--gold)}
.dot.min{border:2px solid var(--ivory);background:var(--bg)}
.dot.ese{background:var(--mu2)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mu);margin-top:4px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.leitura{margin:14px 0 0;font-size:15px;color:var(--tx)}
.leitura.at{color:var(--warn)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.nums label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.tab{display:grid;gap:0}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 215px 135px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.tr.h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu2);padding-top:0}
.tr .n{font-size:15px;color:var(--ivory)}
.tr .n small{display:block;font-size:12px;color:var(--mu2)}
.tr .m{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.tr .tt{text-align:right;font-variant-numeric:tabular-nums;color:var(--ivory)}
.tr .moeda>.campo{min-height:42px;padding-top:8px;padding-bottom:8px;font-size:15px}
.tr.tot{border-bottom:none;font-weight:500}
.tr.tot .tt{font-family:var(--display);font-size:24px;color:var(--gold)}
.conf{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--ln2);color:var(--mu);vertical-align:1px}
.conf.alta{border-color:var(--gold2);color:var(--gold)}
@media (max-width:560px){.tr{grid-template-columns:minmax(0,1fr) 120px}.tr .m{grid-column:1/-1;order:3;margin-top:-6px}.tr .tt{display:none}.tr.h .m,.tr.h .tt{display:none}.tr.tot .tt{display:block}}
.passos{display:grid}
.ps{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--ln)}
.ps .i{font-family:var(--display);color:var(--gold);font-size:18px}
.ps .l{color:var(--tx);font-size:15px}
.ps .l small{display:block;color:var(--mu2);font-size:12px}
.ps .v{font-variant-numeric:tabular-nums;color:var(--ivory);white-space:nowrap}
.ps.fim{border-bottom:none}
.ps.fim .v{font-family:var(--display);font-size:28px;color:var(--gold)}
.nota{font-size:14px;color:var(--mu);margin:12px 0 0}
.ese-box{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.ese-box{grid-template-columns:1fr}}
.ese-out{font-size:16px;color:var(--tx)}
.ese-out .big{display:block;font-family:var(--display);font-size:30px;color:var(--ivory);line-height:1.15}
.ese-out.at .big{color:var(--warn)}
.cuid{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.cuid li{position:relative;padding-left:22px;font-size:15px;color:var(--tx)}
.cuid li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--gold2)}
.cuid li small{color:var(--mu2);font-size:12px}
details.fontes{margin-top:36px;border-top:1px solid var(--ln);padding-top:14px;font-size:14px;color:var(--mu)}
details.fontes summary{cursor:pointer;color:var(--tx)}
details.fontes p{margin:10px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.acoes .btn{flex:1 1 200px}
.pdfp{margin-top:16px;background:var(--s1);border:1px solid var(--ln2);border-radius:14px;padding:14px 16px}
.pdfp .pb{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0 10px}
.pdfp .pb i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.pdfp .st{font-size:14px;color:var(--ivory);display:flex;justify-content:space-between}
.pdfp ol{list-style:none;margin:0;padding:0;font-size:13px;color:var(--mu2);display:grid;gap:4px}
.pdfp li.ok{color:var(--mu)}
.pdfp li.ok::before{content:"✓ ";color:var(--gold)}
.pdfp li.agora{color:var(--ivory)}
.pdfp li.agora::before{content:"› ";color:var(--gold)}
.pdfp .msg{font-size:14px;color:var(--warn);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Papel do PDF (A4 a 96 dpi), montado fora da tela */
#papel{position:absolute;left:-12000px;top:0;width:794px}
.pg{width:794px;min-height:1123px;background:#fff;color:var(--p-tx);font-family:var(--body);font-size:13px;line-height:1.5;padding:0 0 76px;position:relative}
.pg .band{background:var(--p-ink);color:#F3EEE3;padding:30px 56px 26px}
.pg .band .e{color:#D9B872;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.pg .band h1{font-family:var(--display);font-weight:500;font-size:36px;line-height:1.1;margin:8px 0 4px;color:#F3EEE3}
.pg .band p{margin:0;color:#B8BFCC;font-size:13px}
.pg .ct{padding:8px 56px 0}
.pg .ps2{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--p-ln);padding-bottom:6px;margin:26px 0 12px}
.pg .ps2 b{font-family:var(--display);color:var(--p-gold);font-size:18px;font-weight:600}
.pg .ps2 span{font-family:var(--display);color:var(--p-ink);font-size:22px;font-weight:600}
.pg .rg{margin-top:12px;border:1px solid var(--p-ln);border-radius:10px;padding:10px 14px}
.pg .rg .rr .lb{color:var(--p-tx);font-size:12px}
.pg .rg .rr .lb span:last-child{color:var(--p-mu)}
.pg .rg .rr.dentro .lb span:first-child{color:var(--p-gold);font-weight:600}
.pg .rg .trk{background:var(--p-soft)}
.pg .rg .seg{background:#D6D0C2}
.pg .rg .rr.dentro .seg{background:#C9A45C}
.pg .rg .tick{background:var(--p-gold)}
.pg .rg .rr.voce .trk{border-top-color:#D6D0C2}
.pg .rg .dot.sug{background:var(--p-gold)}
.pg .rg .dot.min{border-color:var(--p-ink);background:#fff}
.pg .rg .dot.ese{background:#9AA1AD}
.pg .rg .leg{color:var(--p-mu)}
.pg .lt{margin:10px 0 0;color:var(--p-tx)}
.pg table{width:100%;border-collapse:collapse;font-size:12px;color:var(--p-tx)}
.pg th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--p-mu);font-weight:500;border-bottom:1px solid var(--p-ln);padding:6px 6px 6px 0}
.pg td{color:var(--p-tx);border-bottom:1px solid var(--p-ln);padding:7px 6px 7px 0;vertical-align:top}
.pg td.r,.pg th.r{text-align:right;padding-right:0;white-space:nowrap}
.pg td small{display:block;color:var(--p-mu);font-size:10px}
.pg tr.t td{border-bottom:none;font-weight:600;color:var(--p-ink)}
.pg .pp{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--p-ln)}
.pg .pp .i{font-family:var(--display);color:var(--p-gold);font-weight:600}
.pg .pp .v{white-space:nowrap;color:var(--p-ink)}

function arred(x){

var PISO_GRUPO = 5000;
var TETO_GRUPO = [[1,8000],[3,10000],[6,15000],[12,25000]];   /* [meses, teto]; entre os pontos a linha é reta; acima de 12 meses vale o de 1 ano */
var MULT_FORMATO = {grupo:1, individual:2, premium:4};
function legado(){ return !(s.motor>=8); }
function tetoGrupoMeses(m){
  var P=TETO_GRUPO, n=P.length;
  if(!(m>P[0][0])) return P[0][1];
  if(m>=P[n-1][0]) return P[n-1][1];
  for(var i=1;i<n;i++){ if(m<=P[i][0]){ var a=P[i-1], b=P[i]; return a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0]); } }
  return P[n-1][1];
}
/* [piso, teto] do formato e da duração escolhidos. Sem duração (não acontece no fluxo): usa 6 meses. */
function faixaFormato(){

  var m=s.periodo>0?s.periodo:6, k=MULT_FORMATO[s.produto]||1;
  return [PISO_GRUPO*k, tetoGrupoMeses(m)*k];

function turmaSePaga(c,P){ var den=P*K-c.Cp; if(!(den>0)) return null; return Math.max(1,Math.ceil((c.H*c.hora+c.Ct)/den-1e-9)); }

  var itens=parceirosLista().map(function(p){ var tot=p.qtd*p.valor; p.tot=tot; p.turma=(g&&p.esc==='turma'); p.pp=tot; if(p.turma) Ct+=tot; else Cp+=tot; return p; });

  }
  var vit=arred(base);
  if(vit<pisoMin){ var st=base>=10000?1000:(base>=1000?100:10); vit=Math.ceil((base+st/10)/st)*st-st/10; }
  var stpF=fx[0]>=1000?100:10, pisoFaixaR=Math.min(Math.ceil(fx[0]/stpF)*stpF,vit);
  var stp=pisoMin>=1000?100:10, pisoR=Math.min(Math.ceil(pisoMin/stp)*stp,vit);
  var c={motor:8,g:g,N:1,H:H,hora:hora,horaM:horaMercado(nvx),T:Tw,itens:itens,Cp:Cp,Ct:Ct,pts:pts,nv:nv,pNivel:pNivel,piso:piso,custoLucro:custoLucro,sug:base,origem:origem,vit:vit,pisoR:pisoR,pisoFaixaR:pisoFaixaR,faixa:fx,regua:faixaRegua(),cobra:s.cobra,gap:(s.cobra>0?vit-s.cobra:null),X:null,capacidade:(g?null:s.capacidade)};

function calcularV7(nvx){

function nomeOk(n){ return n.split(' ').filter(function(p){ return (p.match(/\p{L}/gu)||[]).length>=2; }).length>=2; }
/* mesma normalização do banco: só dígitos; com 12 ou mais e começando em 55, tira o 55; senão tira os zeros à esquerda; vale de 10 a 13 dígitos */
function zapNorm(z){ var d=String(z||'').replace(/\D/g,''); return (d.length>=12&&d.indexOf('55')===0)?d.slice(2):d.replace(/^0+/,''); }
function zapOk(z){ var n=zapNorm(z).length; return n>=10&&n<=13; }
function mascaraZap(v){
  var d=String(v||'').replace(/\D/g,'').slice(0,13);
  if(d.length>=12) return '+'+d.slice(0,2)+' ('+d.slice(2,4)+') '+d.slice(4,d.length-4)+'-'+d.slice(-4);
  if(d.length>10) return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length>6) return '('+d.slice(0,2)+') '+d.slice(2,d.length-4)+'-'+d.slice(-4);
  if(d.length>2) return '('+d.slice(0,2)+') '+d.slice(2);
  return d;
}

/* chamada às funções do banco (as mesmas chaves e cabeçalhos do Teste de Arquétipos) */
async function rpc(fn,args,ms){
  var ctl=new AbortController(), t=setTimeout(function(){ ctl.abort(); },ms||15000);
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'},body:JSON.stringify(args),signal:ctl.signal});
    var txt=await r.text(), j=null; try{ j=txt?JSON.parse(txt):null; }catch(x){}
    if(!r.ok){ var er=new Error((j&&j.message)||('HTTP '+r.status)); er.status=r.status; throw er; }
    return j;
  }catch(e){
    if(e&&(e.name==='AbortError'||e instanceof TypeError)){ var re=new Error('rede'); re.rede=true; throw re; }
    throw e;
  }finally{ clearTimeout(t); }
}
function traduzErro(e){
  var m=(e&&e.message)||'';
  if(e&&e.rede) return 'Não consegui falar com o servidor. Confira a internet e tente de novo.';
  if(/Consentimento/i.test(m)) return 'É preciso concordar com a guarda das respostas para continuar.';
  if(/PIN\s*inv/i.test(m)) return 'PIN inválido.';
  if(/Limite di/i.test(m)) return 'O sistema recebeu respostas demais hoje. Avise a equipe do Mentor de Líderes.';
  if(/WhatsApp inv/i.test(m)) return 'Confira o número do WhatsApp com DDD.';
  if(/Nome inv/i.test(m)) return 'Confira o nome completo.';
  if(/Turma inv/i.test(m)) return 'O link da turma não está certo. Peça um novo à equipe.';
  return 'Algo não deu certo. Tente de novo.';
}

/* Pergunta 5: o que o cliente recebe além dos encontros. Marque quantos quiser; "Nada além dos encontros" desmarca os outros. */
function telaRecebe(){
  var im=s.produto==='imersao', dias=[1,2,3];
  var lista=RECEBE.filter(function(r){ return !(im&&r.v==='evento'); });
  var rec=(s.recebe||[]).filter(function(x){ return x==='nada'||lista.some(function(r){return r.v===x;}); });
  var foraEv=s.eventoDias>0&&dias.indexOf(s.eventoDias)<0;
  function cartao(id,t,d){
    var on=rec.indexOf(id)>=0;
    return '<div class="serv'+(on?' sel':'')+'" role="checkbox" tabindex="0" aria-checked="'+on+'" data-r="'+id+'"><span class="cx" aria-hidden="true">'+(on?'✓':'')+'</span><span class="txt"><span class="t">'+esc(t)+'</span>'+(d?'<span class="d">'+esc(d)+'</span>':'')+'</span></div>';

  lista.forEach(function(r){
    html+=cartao(r.v,r.t,r.d);
    if(r.v==='livro') html+='<div class="sub-r" id="sr-livro"'+(rec.indexOf('livro')>=0?'':' hidden')+'><label class="rot" for="rc-livro">Quanto custa cada exemplar para você? (R$)</label><div class="moeda"><span>R$</span><input class="campo" id="rc-livro" inputmode="decimal" placeholder="0 se for digital" value="'+(s.livroCusto!=null?esc(s.livroCusto.toLocaleString('pt-BR',{maximumFractionDigits:2})):'')+'"></div><p class="erro" id="e-livro"></p></div>';
    if(r.v==='evento') html+='<div class="sub-r" id="sr-evento"'+(rec.indexOf('evento')>=0?'':' hidden')+'><span class="rot">Quantos dias?</span><div class="chips" role="radiogroup" aria-label="Dias de evento presencial">'+dias.map(function(d){return '<button class="chip" role="radio" aria-checked="false" data-ev="'+d+'">'+d+'</button>';}).join('')+'<button class="chip" role="radio" aria-checked="false" data-ev="outro">outro</button></div>'+caixaOutro('ou-ev',false,'Dias, de 1 a 10',foraEv?s.eventoDias:'')+'</div>';
  });
  html+=cartao('nada','Nada além dos encontros','')+'</div><p class="erro" id="e-recebe"></p></div>'+
    '<div class="barra"><div class="in"><span class="info" id="b-info"></span><button class="btn" id="b-seguir">Continuar</button></div></div>';
  app.innerHTML=html;
  document.getElementById('b-voltar').onclick=anterior;
  var iev=document.getElementById('ou-ev-in'); if(iev) iev.setAttribute('aria-label','Dias de evento presencial, de 1 a 10');
  if(foraEv&&rec.indexOf('evento')>=0) document.getElementById('ou-ev').hidden=false;
  function guarda(){ s.recebe=RECEBE.map(function(r){return r.v;}).concat(['nada']).filter(function(x){return rec.indexOf(x)>=0;}); }
  function foraEvento(){ return s.eventoDias>0&&dias.indexOf(s.eventoDias)<0; }
  function pinta(){
    app.querySelectorAll('.serv[data-r]').forEach(function(el){ var on=rec.indexOf(el.getAttribute('data-r'))>=0; el.classList.toggle('sel',on); el.setAttribute('aria-checked',on); el.querySelector('.cx').textContent=on?'✓':''; });
    var sl=document.getElementById('sr-livro'); if(sl) sl.hidden=rec.indexOf('livro')<0;
    var se=document.getElementById('sr-evento'); if(se) se.hidden=rec.indexOf('evento')<0;
    app.querySelectorAll('.chip[data-ev]').forEach(function(c){ var v=c.getAttribute('data-ev'), on=v==='outro'?foraEvento():parseInt(v,10)===s.eventoDias; c.classList.toggle('sel',!!on); c.setAttribute('aria-checked',!!on); });
    var n=rec.filter(function(x){return x!=='nada';}).length;

  }
  function alterna(el){
    var id=el.getAttribute('data-r'), i=rec.indexOf(id);
    if(i>=0) rec.splice(i,1);
    else if(id==='nada'){ rec.length=0; rec.push('nada'); }
    else { var j=rec.indexOf('nada'); if(j>=0) rec.splice(j,1); rec.push(id); }
    document.getElementById('e-recebe').textContent='';
    guarda(); pinta();
  }
  app.querySelectorAll('.serv[data-r]').forEach(function(el){
    el.onclick=function(e){ ripple(e,el); alterna(el); };
    el.onkeydown=function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); alterna(el); } };
  });
  app.querySelectorAll('.chip[data-ev]').forEach(function(c){

      var v=c.getAttribute('data-ev');

      var raw=inp.value.trim(), n=num(raw);
      if(raw===''||!(n>=0&&n<=5000)){ document.getElementById('e-livro').textContent='Digite quanto custa cada exemplar, de R$ 0 a R$ 5.000. Se for digital, digite 0.'; inp.scrollIntoView({behavior:reduz?'auto':'smooth',block:'center'}); inp.focus(); return; }
      s.livroCusto=n;
    }
    if(rec.indexOf('evento')>=0 && !(s.eventoDias>=1)){ document.getElementById('ou-ev-e').textContent='Escolha quantos dias de evento.'; document.getElementById('sr-evento').scrollIntoView({behavior:reduz?'auto':'smooth',block:'center'}); return; }
    guarda(); proximo();
  };

function carregar(src){ return new Promise(function(ok,err){ var sc=document.createElement('script'); sc.src=src; sc.onload=ok; sc.onerror=function(){err(new Error('carga'));}; document.head.appendChild(sc); }); }
async function gerarPDF(onEtapa){
  onEtapa(0,0);
  if(!window.html2canvas) await carregar('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!window.jspdf) await carregar('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  var papel=document.getElementById('papel'); papel.innerHTML=htmlPapel().join('');
  var pdf=new window.jspdf.jsPDF({orientation:'p',unit:'mm',format:'a4'});
  var pgs=papel.querySelectorAll('.pg'), N=pgs.length;
  for(var i=0;i<N;i++){
    onEtapa(i+1,N);
    var cv=await window.html2canvas(pgs[i],{scale:2,backgroundColor:'#ffffff',logging:false});
    var img=cv.toDataURL('image/jpeg',0.92), h=cv.height/cv.width*210;
    if(i>0) pdf.addPage();
    if(h>297){ var wd=297/h*210; pdf.addImage(img,'JPEG',(210-wd)/2,0,wd,297); } else pdf.addImage(img,'JPEG',0,0,210,h);
  }
  onEtapa(N+1,N);
  papel.innerHTML='';
  return pdf.output('blob');
}

}

    if(N) totalPag=N; else N=totalPag;
    var etapas=['Carregando o gerador de PDF'];
    if(N){ for(var j=1;j<=N;j++) etapas.push('Montando a página '+j+' de '+N); } else etapas.push('Montando as páginas');
    etapas.push('Preparando o arquivo');

    box.innerHTML='<div class="pdfp" role="status"><div class="st"><span>'+(msg?'Não foi possível baixar':etapas[Math.min(k,fim-1)])+'</span><span>'+pct+'%</span></div><div class="pb"><i style="width:'+pct+'%"></i></div>'+
      (msg?'<p class="msg">'+msg+'</p>':'<ol>'+etapas.map(function(t,i){return '<li class="'+(i<k?'ok':i===k?'agora':'')+'">'+t+'</li>';}).join('')+'</ol>')+'</div>';
  }
  try{
    var blob=await gerarPDF(function(k,N){ pinta(k,N); });
    var nome='Preco-'+prodNome().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'.pdf';
    pinta(totalPag+2,totalPag);
    await salvar(blob,nome);
    box.innerHTML='<div class="pdfp" role="status"><div class="st"><span>PDF pronto</span><span>100%</span></div><div class="pb"><i style="width:100%"></i></div><p class="nota" style="margin:0">'+esc(nome)+'</p></div>';
  }catch(err){
    var cd=err&&err.code, m='Não consegui gerar o PDF. Tente de novo.';
    if(cd==='declined') m='Download cancelado.';
    else if(cd==='unavailable'||cd==='not_granted'||cd==='capability_disabled') m='O download não está disponível nesta visualização. Abra o link pelo claude.ai.';
    else if(err&&err.message==='carga') m='Não consegui carregar o gerador de PDF. Confira a internet e tente de novo.';
    pinta(0,0,m);
  }finally{ gerando=false; document.getElementById('papel').innerHTML=''; }
}
