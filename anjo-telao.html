    --bg:#000A2E;
    --line:rgba(234,229,225,.15);
    --cream:#EAE5E1;
    --muted:rgba(234,229,225,.72);
    --accent:#D8A038;
    --accent-2:#B98300;
    --accent-soft:#F2C86B;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(0,88,216,.30), transparent 60%),
      linear-gradient(180deg,#001B5E 0%,var(--bg) 55%,#000024 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  body.quieto{cursor:none}
  h2,p{margin:0}
  :focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-radius:6px}
  .kicker{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-size:14px}
  .barra{height:8px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
  .barra>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent-soft));border-radius:inherit;transition:width .4s}
  #telao{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,18px);padding:20px;text-align:center; background:radial-gradient(1000px 600px at 50% -10%,rgba(0,88,216,.34),transparent 65%),linear-gradient(180deg,#001B5E 0%,var(--bg) 55%,#000024 100%);overflow:auto}
  #telao .t-mk{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #telao .t-mk div{height:min(86vh,80vw);aspect-ratio:549/900;opacity:.07;background-color:var(--accent);-webkit-mask:var(--aguia) center/contain no-repeat;mask:var(--aguia) center/contain no-repeat}
  #telao>*:not(.t-mk){position:relative}
  #telao .t-logo{height:clamp(44px,8vh,84px);width:auto}
  #telao h2{font-size:clamp(28px,5.4vh,56px);font-weight:900}
  #telao .t-nome{font-size:clamp(16px,2.8vh,26px);color:var(--muted);font-weight:600;max-width:40ch;overflow-wrap:anywhere}
  #telao .qr{background:#fff;padding:clamp(10px,1.8vh,18px);border-radius:16px;line-height:0;box-shadow:0 18px 48px rgba(0,0,0,.45)}
  #telao .qr img,#telao .qr canvas{display:block}
  #telao .t-cont{width:min(560px,92vw);font-variant-numeric:tabular-nums}
  #telao .t-cont p{font-size:clamp(16px,2.6vh,24px);font-weight:600;margin-top:6px}
  #telao .t-cont strong{color:var(--accent-soft);font-size:1.25em}
  #telao .t-cont .barra{height:12px}
  #telao .t-url{font-size:clamp(12px,1.8vh,16px);color:var(--muted);word-break:break-all;max-width:90vw}
  #telao .t-status{font-size:clamp(16px,2.6vh,24px);font-weight:600;margin-top:6px}
  .tela-cheia{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));z-index:3;appearance:none;cursor:pointer;
    border:1px solid var(--line);background:rgba(0,12,72,.7);color:var(--cream);font:700 14px 'Montserrat',system-ui,sans-serif;padding:10px 16px;border-radius:12px;transition:opacity .3s}
  body.quieto .tela-cheia{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.barra>i,.tela-cheia{transition:none}}
</style>
</head>
<body>
<button class="tela-cheia" id="tela-cheia" type="button">Tela cheia</button>

  var SUPABASE_URL = 'https://pggcbvafkwyqyvlkiyti.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnZ2NidmFma3d5cXl2bGtpeXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY5NDMsImV4cCI6MjEwMTA5Mjk0M30.y2FaXpreVN_eeFMmlWDuQUXCN3C69qI8ooTcRl2k7ZI';
  var $ = function(id){ return document.getElementById(id); };
  var cod = '';
  try { cod = (new URLSearchParams(location.search).get('e') || '').trim().toLowerCase(); } catch (e) {}
  var SB = null;
  try { if (window.supabase && window.supabase.createClient) SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { SB = null; }
  var timer = null, status = '';

  function linkAluno(c){
    try { return new URL('anjo.html?e=' + encodeURIComponent(c), location.href).href; }
    catch (e) { return 'anjo.html?e=' + c; }
  }
  function tamanhoQR(){ return Math.floor(Math.max(180, Math.min(window.innerWidth * 0.78, window.innerHeight * 0.46, 560))); }
  function desenharQR(){
    var alvo = $('t-qr'); if (!alvo || !cod) return;
    alvo.innerHTML = '';
    var link = linkAluno(cod), tam = tamanhoQR();
    if (window.QRCode) {
      try { new QRCode(alvo, {text: link, width: tam, height: tam, colorDark: '#000A2E', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M}); return; }
      catch (e) {}
    }
    alvo.style.cssText = 'max-width:' + tam + 'px;color:#000A2E;font-weight:700;word-break:break-all;line-height:1.4';
    alvo.textContent = link;
  }
  function mostrar(d){
    if (!d || d.ok === false) {
      $('t-nome').textContent = 'Dinâmica não encontrada';
      $('t-texto').textContent = 'Abra o telão de novo pelo painel do time.';
      $('t-fill').style.width = '0%';
      status = 'encerrado';
      return;
    }
    status = d.status;
    $('t-nome').textContent = d.nome;
    document.title = '[HOMOLOG] Dinâmica do Anjo · ' + d.nome;
    var n = Number(d.total) || 0, s = Number(d.sortearam) || 0;
    $('t-fill').style.width = (n ? Math.round(s / n * 100) : 0) + '%';
    var t = $('t-texto');
    if (status === 'aberto') t.innerHTML = '<strong>' + s + '</strong> de ' + n + ' já sortearam';
    else if (status === 'lista') t.textContent = 'O sorteio ainda não foi aberto.';
    else if (status === 'fechado') t.textContent = 'Sorteio fechado · ' + n + ' anjos no jogo';
    else t.textContent = 'Dinâmica encerrada.';
  }
  function agendar(){
    clearTimeout(timer);
    if (status === 'encerrado') return;
    timer = setTimeout(function(){
      if (document.visibilityState === 'visible') ler(); else agendar();
    }, status === 'aberto' ? 20000 : 120000);
  }
  async function ler(){
    if (SB) {
      try { var r = await SB.rpc('gamificacao_anjo_telao', {p_evento: cod}); if (!r.error) mostrar(r.data); }
      catch (e) {}
    } else {
      $('t-texto').textContent = 'Sem conexão com o sistema. Recarregue a página.';
    }
    agendar();
  }

  // tela cheia: o botão some em tela cheia e quando o mouse fica parado
  function emTelaCheia(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function ajustarBotao(){ $('tela-cheia').hidden = emTelaCheia(); }
  $('tela-cheia').addEventListener('click', function(){
    var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return;
    try { var p = f.call(el); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  });
  document.addEventListener('fullscreenchange', ajustarBotao);
  document.addEventListener('webkitfullscreenchange', ajustarBotao);
  var parado = null;
  document.addEventListener('mousemove', function(){
    document.body.classList.remove('quieto');
    clearTimeout(parado);
    parado = setTimeout(function(){ document.body.classList.add('quieto'); }, 3000);
  });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && status !== 'encerrado') ler(); });
  var redim = null;
  window.addEventListener('resize', function(){ clearTimeout(redim); redim = setTimeout(desenharQR, 150); });

  if (!cod) {
    $('t-nome').textContent = 'Falta o código da dinâmica';
    $('t-texto').textContent = 'Abra o telão pelo botão do painel do time.';
    return;
  }
  $('t-url').textContent = linkAluno(cod);
  desenharQR();
  ler();
})();
</script>
</body>
</html>
