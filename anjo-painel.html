    --bg:#000A2E;
    --panel:#001854;
    --line:rgba(234,229,225,.15);
    --line-2:rgba(234,229,225,.28);
    --cream:#EAE5E1;
    --muted:rgba(234,229,225,.72);
    --faint:rgba(234,229,225,.5);
    --accent:#D8A038;
    --accent-2:#B98300;
    --accent-soft:#F2C86B;
    --accent-bg:rgba(216,160,56,.14);
    --ink:#141008;
    --ok:#63F858;
    --ok-bg:rgba(99,248,88,.13);
    --ok-line:rgba(99,248,88,.55);
    --bad:#FF7B7B;
    --bad-bg:rgba(255,123,123,.13);
    --bad-line:rgba(255,123,123,.5);
    --warn:#F2A93B;
    --warn-bg:rgba(242,169,59,.14);
    --fonte:'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --cond:'Barlow Condensed', 'Arial Narrow', sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(1200px 700px at 80% -10%, rgba(0,88,216,.30), transparent 60%),
      linear-gradient(180deg,#001B5E 0%,var(--bg) 55%,#000024 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:var(--fonte);
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;overflow-x:hidden;
  }
  h1,h2,h3,h4,p{margin:0}
  h2,h3{text-wrap:balance;line-height:1.2}
  ul,ol{margin:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-radius:6px}
  [tabindex="-1"]:focus{outline:none}
  button{font-family:inherit}

  #mark-bg{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #mark-bg .mk{height:min(78vh,80vw);aspect-ratio:549/900;opacity:.07;transform:translateY(4vh);background-color:var(--accent);
    -webkit-mask:var(--aguia) center/contain no-repeat;mask:var(--aguia) center/contain no-repeat}

  /* barra do topo, sempre visível */
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:12px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);
    background:rgba(0,10,46,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  header.top .logo{height:44px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
  .titles{display:flex;flex-direction:column;line-height:1.1}
  .kicker{font-family:var(--cond);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-size:14px}
  header.top h1{font-size:clamp(17px,2.4vw,23px);font-weight:800}
  .spacer{flex:1 1 auto;min-width:8px}
  .conn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
  .conn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .conn.on .dot{background:var(--ok)}
  #espera{position:fixed;top:0;left:0;right:0;z-index:30;height:3px;background:transparent;overflow:hidden}
  #espera i{display:block;height:100%;width:34%;visibility:hidden;background:linear-gradient(90deg,var(--accent-2),var(--accent-soft));animation:desliza 1.1s ease-in-out infinite}
  #espera.on i{visibility:visible}
  @keyframes desliza{0%{margin-left:-34%}100%{margin-left:100%}}

  main{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(16px,3vw,28px) clamp(16px,4vw,40px) 90px}

  /* botões */
  .btn{appearance:none;cursor:pointer;border:1px solid var(--line-2);background:rgba(0,12,72,.55);color:var(--cream);font:700 14px var(--fonte);padding:11px 18px;min-height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent-soft)}
  .btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--cream)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .btn.pri:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--ink)}
  .btn.pri:disabled{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .btn.grande{padding:14px 22px;font-size:15.5px;min-height:48px}
  .btn.perigo{border-color:var(--bad-line);color:var(--bad);background:var(--bad-bg)}
  .btn.perigo:hover{background:rgba(255,123,123,.22);border-color:var(--bad);color:var(--bad)}
  .btn.mini{min-height:34px;padding:6px 12px;font-size:12.5px;border-radius:9px}
  .link-btn{appearance:none;background:none;border:0;padding:6px 0;min-height:34px;color:var(--accent-soft);font:700 13.5px var(--fonte);cursor:pointer;text-decoration:none}
  .link-btn:hover{text-decoration:underline;text-underline-offset:3px}
  .btn.voltar{margin-bottom:14px}
  .btn.voltar .seta-v{font-size:18px;line-height:1;color:var(--accent-soft)}
  .btn.encerrar{border-color:var(--accent);color:var(--accent-soft);background:transparent}
  .btn.encerrar:hover{background:var(--accent-bg);border-color:var(--accent-soft);color:var(--accent-soft)}
  .caixa-topo{margin:-4px 0 16px}
  .pin-campo{max-width:260px}
  .pin-err{color:var(--bad);font-size:14px;font-weight:700}
  .aviso-fechar,.aviso-sorteio{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid rgba(216,160,56,.65);background:var(--accent-bg);margin-bottom:14px}
  .aviso-fechar .txt,.aviso-sorteio .txt{flex:1;min-width:220px}
  .aviso-fechar .txt b,.aviso-sorteio .txt b{display:block;font-size:16px}
  .aviso-fechar .txt span,.aviso-sorteio .txt span{font-size:13.5px;color:var(--muted)}
  .aviso-fechar>.confirma-caixa{flex:1 1 100%}
  .cartao.historico{margin-top:14px}

  /* estrutura */
  .kicker-sm{font-family:var(--cond);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-size:13px}
  .din-topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin:6px 0 16px}
  .din-topo>div{min-width:0}
  .din-topo h2{font-size:clamp(22px,2.8vw,30px);font-weight:900;overflow-wrap:anywhere}
  .din-topo .meta{color:var(--muted);font-size:13.5px;margin-top:4px}
  .din-topo .meta .link-btn{margin-left:8px;padding:0;min-height:0}
  .secao-tit{font-family:var(--cond);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-size:13px;margin:22px 0 8px}
  .cartao{background:rgba(0,24,84,.72);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
  .cartao h3{font-size:17px;font-weight:800;margin-bottom:4px}
  .ajuda{color:var(--muted);font-size:13.5px}
  .grade-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
  .parecido{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0}
  .grade-sorteio{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
  @media (min-width:900px){.grade-sorteio{grid-template-columns:minmax(260px,1fr) minmax(0,2fr)}}
  .pilha{display:flex;flex-direction:column;gap:14px}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .mt{margin-top:14px}
  .rodape-passo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 20px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .rodape-passo .ajuda{max-width:58ch;flex:1 1 260px}
  .rodape-passo>.confirma-caixa{flex:1 1 100%}

  /* passos */
  .passos{list-style:none;padding:0;margin:0 0 20px;display:flex;flex-wrap:wrap;gap:8px 0;align-items:center}
  .passos li{display:flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--faint)}
  .passos li+li::before{content:"";width:26px;height:2px;background:var(--line);margin:0 8px}
  .passos button,.passos .fixo{appearance:none;background:none;border:0;padding:4px 2px;min-height:34px;display:flex;align-items:center;gap:8px;color:inherit;font:inherit;text-align:left}
  .passos button{cursor:pointer}
  .passos button:hover .rot-p{text-decoration:underline;text-underline-offset:3px}
  .passos .n{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
  .passos li.feito{color:var(--muted)}
  .passos li.feito .n{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .passos li.andamento{color:var(--cream)}
  .passos li.andamento .n{border-color:var(--accent);color:var(--accent-soft)}
  .passos li.atual{color:var(--cream)}
  .passos li.atual .n{background:var(--accent);border-color:var(--accent);color:var(--ink)}

  /* campos */
  .campo{display:flex;flex-direction:column;gap:6px;min-width:0}
  .campo label{font-size:13px;font-weight:700;color:var(--muted)}
  .entrada,input[type=text],input[type=search],input[type=date],input[type=password],textarea{
    width:100%;background:rgba(0,10,46,.75);color:var(--cream);border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;min-height:44px;font:500 15px var(--fonte)}
  textarea{resize:vertical;min-height:220px;font:13.5px/1.7 ui-monospace,Consolas,monospace}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(216,160,56,.3)}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
  input[type=date]{color-scheme:dark}
  .contador-dias{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;width:max-content;max-width:100%}
  .contador-dias span{padding:10px 16px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;display:grid;place-items:center}
  .contador-dias button{appearance:none;border:0;min-width:48px;min-height:44px;padding:10px 14px;background:rgba(234,229,225,.06);color:var(--cream);font:800 18px var(--fonte);cursor:pointer}
  .contador-dias button:hover:not(:disabled){background:var(--accent-bg);color:var(--accent-soft)}
  .contador-dias button:disabled{opacity:.4;cursor:not-allowed}
  .linha-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
  .linha-form .campo{flex:1 1 220px}

  /* PIN */
  .gate{max-width:400px;margin:5vh auto;text-align:center;background:linear-gradient(180deg,rgba(0,36,132,.5),rgba(0,12,72,.78));border:1px solid var(--line);border-radius:20px;padding:32px 26px}
  .gate h2{font-size:22px;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .gate input{text-align:center;letter-spacing:.4em;font-size:22px;font-weight:800;padding:12px;min-height:54px}
  .gate .btn{width:100%;margin-top:14px;min-height:48px;font-size:15px}
  .gate-err{color:var(--bad);font-size:14px;margin-top:12px;min-height:20px}

  /* minhas dinâmicas */
  .lista-din{display:grid;gap:10px}
  .din-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(0,24,84,.72)}
  .din-card b{font-size:16px;overflow-wrap:anywhere}
  .din-card .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .din-card .barra{max-width:260px}
  .vazio-geral{text-align:center;padding:34px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .vazio-geral h3{font-size:19px}
  .vazio-geral p{max-width:48ch}

  /* confirmação dentro da página */
  .confirma-caixa{padding:14px 16px;border-radius:14px;border:1px solid rgba(216,160,56,.6);background:var(--accent-bg);display:flex;flex-direction:column;gap:12px}
  .confirma-caixa p{font-size:14.5px}
  .confirma-caixa.perigo{border-color:var(--bad-line);background:var(--bad-bg)}
  .confirma{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}
.confirma-troca{display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:340px;padding:10px 12px;border:1px solid rgba(255,123,123,.45);border-radius:12px;background:rgba(255,123,123,.10)}
.confirma-troca .o-que{font-size:13px;line-height:1.45;color:var(--cream)}
.confirma-troca .botoes{display:flex;gap:6px;flex-wrap:wrap}
.trocas{margin-top:14px;border-color:rgba(242,169,59,.45)}
.lista-trocas{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px;font-size:13.5px}
.lista-trocas li{display:grid;grid-template-columns:96px 1fr;gap:10px}
.lista-trocas .quando{color:var(--accent-soft);font-weight:700;font-size:12.5px}

  /* faixa do telão */
  .acao-telao{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid rgba(216,160,56,.55);background:var(--accent-bg);margin-bottom:14px}
  .acao-telao .txt{flex:1;min-width:220px}
  .acao-telao .txt b{display:block;font-size:15px}
  .acao-telao .txt span{font-size:13px;color:var(--muted)}

  /* números */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:14px}
  .kpi{background:rgba(0,24,84,.72);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .kpi .num{font-size:32px;font-weight:900;line-height:1.05;color:var(--accent-soft);font-variant-numeric:tabular-nums}
  .kpi .num small{font-size:15px;color:var(--muted);font-weight:600}
  .kpi .rot{font-size:13px;color:var(--muted)}
  .kpi.risco{border-color:var(--bad-line);background:var(--bad-bg)}
  .kpi.risco .num{color:var(--bad)}
  .kpi.ok .num{color:var(--ok)}
  .barra{height:8px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);overflow:hidden;margin-top:6px}
  .barra>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent-soft));border-radius:inherit;transition:width .4s}

  /* listas, chips e tabelas */
  .lista-linhas{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px;max-height:420px;overflow:auto}
  .lista-linhas li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .lista-linhas li:last-child{border-bottom:0}
  .chips{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px;max-height:360px;overflow:auto}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--cream);background:rgba(0,10,46,.55);display:inline-flex;align-items:center;gap:6px}
  .chip .x{appearance:none;border:0;background:none;color:var(--muted);font:700 16px/1 var(--fonte);cursor:pointer;min-width:24px;min-height:24px;padding:0;border-radius:50%}
  .chip .x:hover{color:var(--bad)}
  .chip.conf{border-color:var(--bad-line);background:var(--bad-bg);padding:4px 6px 4px 10px}
  .chips.discreto .chip{color:var(--muted)}
  .problema{border:1px solid rgba(242,169,59,.5);background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:13.5px}
  .problema b{color:var(--warn)}
  .problema ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
  .aviso-ok{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:12px;padding:9px 12px;font-size:13.5px}
  .rolagem{overflow-x:auto}
  .tabela{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
  .tabela.larga{min-width:760px}
  .tabela th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tabela td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tabela .n{text-align:right;font-variant-numeric:tabular-nums;width:56px}
  .tabela .seta{color:var(--accent);width:24px;text-align:center}
  .tabela .vazio{color:var(--muted);text-align:center;padding:24px 10px}
  .tabela .quando{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tabela tr.risco td{background:var(--bad-bg)}
  .tabela tr.risco td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .tabela .sim{color:var(--ok);font-weight:700}
  .tabela .nao{color:var(--muted)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.risco{background:var(--bad-bg);color:var(--bad)}
  .pill.alerta{background:var(--warn-bg);color:var(--warn)}
  .pill.neutro{background:rgba(234,229,225,.08);color:var(--muted)}
  .busca{margin:10px 0 6px}
  .discreto-bloco{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
  .discreto-bloco .ajuda{margin-bottom:4px}

  /* imersão */
  .passo-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin-bottom:14px}
  .passo-cab h3{font-size:18px;font-weight:800}
  .dias{display:inline-flex;border:1px solid var(--line-2);border-radius:11px;overflow-x:auto;max-width:100%}
  .dias button{appearance:none;border:0;background:none;padding:9px 14px;min-height:40px;font:700 13px var(--fonte);color:var(--muted);cursor:pointer;white-space:nowrap}
  .dias button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-soft)}
  .links-sec{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px}
  .copia{margin-top:12px}
  .copia p{font-size:13.5px;color:var(--muted);margin-bottom:6px}
  .copia textarea{min-height:0;font:500 14px var(--fonte)}
  .roda-hist{margin-top:16px}

  /* roda */
  .roda{width:100%;height:auto;max-width:760px;display:block;margin:0 auto}
  .arco{fill:none;stroke:var(--accent);stroke-width:1.8;opacity:.75}
  .mk{fill:var(--accent)}
  .ponto{fill:var(--accent)}
  .ponto.vazio{fill:var(--bg);stroke:var(--muted);stroke-width:1.6}
  .rotulo{fill:var(--cream);font-family:var(--fonte);font-weight:500}
  .hist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px;font-size:14px;max-height:620px;overflow:auto}
  .hist li{display:grid;grid-template-columns:104px 1fr;gap:10px}
  .hist .quando{color:var(--accent);font-weight:700;font-size:12.5px;padding-top:2px;font-variant-numeric:tabular-nums}

  /* encerrada */
  .podio{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
  .podio li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,10,46,.5)}
  .podio li:first-child{border-color:var(--accent);background:var(--accent-bg)}
  .podio .p{font-weight:900;color:var(--accent-soft)}
  .podio .q{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chave{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .chave>div{flex:1 1 220px;min-width:0}
  .toggle{appearance:none;border:0;padding:0;width:50px;height:28px;border-radius:99px;background:rgba(234,229,225,.18);position:relative;flex:none;cursor:pointer;transition:background .2s}
  .toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);transition:left .2s}
  .toggle[aria-checked="true"]{background:var(--accent)}
  .toggle[aria-checked="true"]::after{left:25px;background:var(--ink)}
  .zona-perigo{border:1px solid var(--bad-line);border-radius:16px;padding:16px 18px;background:var(--bad-bg)}
  .zona-perigo h3{font-size:17px;font-weight:800;margin-bottom:4px}
  .zona-perigo .confirma-caixa{margin-top:12px;background:rgba(0,0,0,.25)}

  #toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;width:min(92vw,560px);pointer-events:none}
  .toast{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);color:var(--cream);padding:12px 16px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:subir .22s ease-out}
  .toast.err{border-left-color:var(--bad)}
  .toast.ok{border-left-color:var(--ok)}
  @keyframes subir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .espera{display:flex;flex-direction:column;gap:12px;text-align:center;max-width:420px;margin:8vh auto}
  .espera h2{font-size:19px}
  .espera .barra{height:9px}
  .espera .barra>i{width:38%;animation:desliza 1.1s ease-in-out infinite}

  @media (max-width:600px){
    header.top{padding:10px 16px;gap:6px 12px}
    header.top .logo{height:34px}
    .kicker{font-size:12px}
    .passos li+li::before{display:none}
    .passos{gap:4px 14px}
    .din-card{grid-template-columns:1fr}
  }
  @media (max-width:480px){
    .btn{white-space:normal}
    .rodape-passo .acoes{width:100%}
    .rodape-passo .btn.grande{width:100%}
    .acao-telao .btn,.aviso-fechar .btn,.aviso-sorteio .btn{flex:1 1 100%}
    .cartao{padding:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    #espera i,.espera .barra>i{width:100%;opacity:.5}
  }
</style>
</head>

<div id="toasts" role="status" aria-live="polite"></div>
<p class="sr" id="status" role="status" aria-live="polite"></p>

<script>
(function(){
  "use strict";

  // Projeto "ACOMPANHAMENTO - TIME CS" (pggcbvafkwyqyvlkiyti), o mesmo da página de gamificação Febracis.
  var SUPABASE_URL = 'https://pggcbvafkwyqyvlkiyti.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnZ2NidmFma3d5cXl2bGtpeXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY5NDMsImV4cCI6MjEwMTA5Mjk0M30.y2FaXpreVN_eeFMmlWDuQUXCN3C69qI8ooTcRl2k7ZI';
  var PIN_KEY = 'febracis_gam_pin_v1';   // o mesmo PIN dos placares: quem entrou em um já entra nos outros
  var AUTO_MS = 30000;                   // atualização automática, só com a aba visível
  var HORA_CORTE = 17;                   // no dia de hoje, "sem mimo" só vira vermelho depois desta hora (Brasília)

  var STATUS_NOME = {lista:'Lista', aberto:'Sorteio aberto', fechado:'Sorteio fechado', encerrado:'Encerrada'};
  var PASSO_DE = {lista:2, aberto:3, fechado:4, encerrado:5};     // passo atual de cada situação
  var PASSO_NOME = ['Criar', 'Lista', 'Sorteio', 'Imersão', 'Encerrada'];
  var MSG_REDE = 'Não conseguimos falar com o servidor. Confira a internet e tente de novo.';

  var SB = null;
  try { if (window.supabase && window.supabase.createClient) SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch (e) { SB = null; }

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  function plural(n, um, varios){ return n === 1 ? um : varios; }
  function cmpNome(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); }

  // ---------- datas (sempre no calendário de Brasília) ----------
  var TZ = 'America/Sao_Paulo';
  function hojeBR(){ return new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); }
  function partes(d){
    var o = {};
    new Intl.DateTimeFormat('pt-BR', {timeZone:TZ, day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(d).forEach(function(x){ o[x.type] = x.value; });
    return o;
  }
  function fmtDM(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] : ''; }
  function fmtQuando(iso){
    if (!iso) return '–';
    var d = new Date(iso); if (isNaN(d.getTime())) return '–';
    var p = partes(d); return p.day + '/' + p.month + ' ' + p.hour + ':' + p.minute;
  }
  function fmtHora(d){ var p = partes(d); return p.hour + ':' + p.minute; }
  function horaBR(){ return parseInt(partes(new Date()).hour, 10); }
  // dia de hoje dentro da dinâmica (1 = primeiro dia). Fora do período devolve 0 ou um número maior que os dias.
  function diaReal(ev){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ev.inicio || ''); if (!m) return 0;
    var h = hojeBR().split('-');
    return Math.round((Date.UTC(+h[0], +h[1] - 1, +h[2]) - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 86400000) + 1;
  }
  function diaHoje(ev){ var d = diaReal(ev); return d >= 1 && d <= ev.dias ? d : 0; }

  // ---------- estado ----------
  var S = {
    fase: 'gate',          // gate | inicio | criar | evento
    pin: '',
    gateErro: '',
    eventos: [],
    codigo: '',
    painel: null,
    C: null,               // contas feitas a partir do painel
    vista: null,           // passo que está na tela (null = o passo da situação atual)
    busca: '',
    diaSel: null,
    confirmar: null,       // {t, id, cod, onde}
    pinConf: '', pinErro: '',   // PIN digitado na caixa de confirmação e o aviso de PIN errado
    histTudo: false, confirmando: false,
    textoLista: '', problemas: [], resultadoLista: '',
    novoNome: '', incluirAberto: false, verRoda: false,
    editar: false,
    cfg: {nome:'', inicio:'', dias:1},
    novo: {nome:'', inicio:hojeBR(), dias:1},
    copia: '', copiaSel: false,
    busy: false,
    carregando: false,
    atualizadoEm: null,
    seq: 0
  };

  // ---------- chamadas ao banco ----------
  async function rpc(fn, args){
    if (!SB) throw new Error('O sistema não carregou. Confira a internet e recarregue a página.');
    var r = await SB.rpc(fn, args);
    if (r.error) throw r.error;
    return r.data;
  }
  function ehPin(e){ return /PIN\s*inv/i.test((e && e.message) || ''); }
  function textoErro(e){
    var m = (e && e.message) || '';
    if (/fetch|network|failed to load/i.test(m)) return MSG_REDE;
    return m || 'Algo não deu certo. Tente de novo.';
  }
  function falhou(e){
    if (ehPin(e)) { irParaGate('PIN inválido. Entre de novo.'); return; }
    toast(textoErro(e), 'err');
  }
  function pinGuardado(){ try { return sessionStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
  function guardarPin(p){ try { sessionStorage.setItem(PIN_KEY, p); } catch (e) {} }
  function esquecerPin(){ try { sessionStorage.removeItem(PIN_KEY); } catch (e) {} }

  function esperar(on, txt){
    S.carregando = !!on;
    $('espera').className = on ? 'on' : '';
    var t = $('conn-txt');
    if (on) { $('conn').hidden = false; t.textContent = txt || 'Atualizando…'; $('status').textContent = txt || 'Atualizando…'; }
    else cabecalho();
  }
  // faz a chamada com o PIN, mostra a espera e devolve {d} ou null (o erro já foi tratado)
  async function exec(fn, args, txt, opc){
    // se uma atualização está em curso, espera a vez em vez de perder o clique
    for (var i = 0; S.busy && i < 100; i++) await new Promise(function(r){ setTimeout(r, 100); });
    if (S.busy) return null;
    S.busy = true; esperar(true, txt);
    var a = {p_pin: S.pin};
    for (var k in args) a[k] = args[k];
    try { return {d: await rpc(fn, a)}; }
    catch (e) {
      if (opc && opc.pinCaixa && ehPin(e)) S.pinErro = 'PIN inválido';   // PIN digitado errado: avisa na própria caixa, sem deslogar
      else falhou(e);
      return null;
    }
    finally { S.busy = false; esperar(false); }
  }

  // ---------- avisos ----------
  function toast(msg, tipo){
    var t = document.createElement('div');
    t.className = 'toast' + (tipo ? ' ' + tipo : '');
    if (tipo === 'err') t.setAttribute('role', 'alert');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, tipo === 'err' ? 8000 : 4500);
  }

  // ---------- contas em cima do JSON do painel (só pessoas ativas) ----------
  function calcular(P){
    var por = {}, anjoDe = {};
    P.pessoas.forEach(function(p){ por[p.id] = p; });
    var ativos = P.pessoas.filter(function(p){ return p.ativo; });
    ativos.forEach(function(a){ if (a.protegido != null && por[a.protegido] && por[a.protegido].ativo) anjoDe[a.protegido] = a.id; });
    var mimosAnjo = {}, mimosProt = {}, mimosDia = {}, deuTotal = {}, totalMimos = 0;
    (P.mimos || []).forEach(function(m){
      mimosAnjo[m.anjo + ':' + m.dia] = (mimosAnjo[m.anjo + ':' + m.dia] || 0) + m.n;
      mimosProt[m.protegido + ':' + m.dia] = (mimosProt[m.protegido + ':' + m.dia] || 0) + m.n;
      mimosDia[m.dia] = (mimosDia[m.dia] || 0) + m.n;
      deuTotal[m.anjo] = (deuTotal[m.anjo] || 0) + m.n;
      totalMimos += m.n;
    });
    var recebi = {};
    (P.recebi || []).forEach(function(r){ recebi[r.protegido + ':' + r.dia] = r.n || 1; });
    var sortearam = ativos.filter(function(p){ return p.protegido != null; });
    sortearam.sort(function(a, b){
      var oa = a.ordem == null ? 1e9 : a.ordem, ob = b.ordem == null ? 1e9 : b.ordem;
      return oa - ob || cmpNome(a, b);
    });
    return {
      por: por, anjoDe: anjoDe, ativos: ativos, sortearam: sortearam,
      pend: ativos.filter(function(p){ return p.protegido == null; }),
      urna: ativos.filter(function(p){ return anjoDe[p.id] == null; }),
      fora: P.pessoas.filter(function(p){ return !p.ativo; }),
      mimosAnjo: mimosAnjo, mimosProt: mimosProt, mimosDia: mimosDia, recebi: recebi,
      deuTotal: deuTotal, totalMimos: totalMimos
    };
  }
  function definirPainel(P){
    var antes = S.painel && S.painel.evento ? S.painel.evento.status : null;
    S.painel = P; S.C = calcular(P);
    // se a situação mudou (por uma ação ou por outra pessoa do time), a tela segue para o passo da nova situação
    if (antes && antes !== P.evento.status) { S.vista = null; S.confirmar = null; S.verRoda = false; }
    var dias = P.evento.dias;
    if (S.diaSel == null || S.diaSel > dias || S.diaSel < 1) S.diaSel = P.evento.dia;
  }

  // ---------- endereços ----------
  function linkAluno(cod){
    try { return new URL('anjo.html?e=' + encodeURIComponent(cod), location.href).href; }
    catch (e) { return 'anjo.html?e=' + cod; }
  }
  function setUrl(cod){
    try {
      var u = new URL(location.href);
      if (cod) u.searchParams.set('e', cod); else u.searchParams.delete('e');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
  }

  // ---------- desenho da roda ----------
  var svgUid = 0;
  function curto(nome){
    var p = String(nome || '').trim().split(/\s+/);
    var s = p.length > 2 ? p[0] + ' ' + p[p.length - 1] : p.join(' ');
    return s.length > 20 ? s.slice(0, 19) + '…' : s;
  }
  function ordemDesenho(C){
    var vis = {}, seq = [];
    function seguir(id){
      var x = id;
      while (x != null && !vis[x] && C.por[x] && C.por[x].ativo) { vis[x] = 1; seq.push(x); x = C.por[x].protegido; }
    }
    C.ativos.filter(function(p){ return C.anjoDe[p.id] == null; }).forEach(function(p){ seguir(p.id); });
    C.ativos.forEach(function(p){ if (!vis[p.id]) seguir(p.id); });
    return seq;
  }
  // roda em SVG: seta só onde existe anjo -> protegido; ponto vazio para quem ninguém tirou
  function rodaSVG(seq, C){
    var n = seq.length; if (n < 2) return '';
    var W = Math.max(460, Math.min(1100, n * 9)), cx = W / 2, cy = W / 2, R = W * 0.34, id = 'r' + (++svgUid);
    var radial = n > 16;                       // com muita gente, o nome gira junto com o raio para não encavalar
    var passo = 2 * Math.PI * R / n;
    var fs = radial ? Math.max(8, Math.min(20, passo * 0.78)) : Math.min(24, W / 24);
    var pad = radial ? Math.max(40, Math.ceil(fs * 0.6 * 20 + 26 - 0.16 * W)) : 120;
    var vpad = radial ? pad : 14;
    var ang = function(i){ return (-90 + i * 360 / n) * Math.PI / 180; };
    var gap = Math.min(15, 140 / n) * Math.PI / 180;
    var P = function(a, r){ return [(cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1)]; };
    var pos = {}; seq.forEach(function(x, i){ pos[x] = i; });
    var arcos = '', pontos = '', textos = '', fechadas = 0;
    seq.forEach(function(x, i){
      var alvo = C.por[x].protegido;
      if (alvo == null || pos[alvo] == null) return;
      var j = pos[alvo]; fechadas++;
      var a1 = ang(i) + gap, a2 = ang(j) - gap;
      var p1 = P(a1, R), p2 = P(a2, R);
      if (j === (i + 1) % n) {
        if (a2 < a1) a2 += 2 * Math.PI;
        p2 = P(a2, R);
        arcos += '<path class="arco" d="M' + p1[0] + ' ' + p1[1] + ' A' + R.toFixed(1) + ' ' + R.toFixed(1) + ' 0 0 1 ' + p2[0] + ' ' + p2[1] + '" marker-end="url(#' + id + 'm)"/>';
      } else {
        var mx = (+p1[0] + +p2[0]) / 2, my = (+p1[1] + +p2[1]) / 2;
        var qx = mx + (cx - mx) * 0.6, qy = my + (cy - my) * 0.6;
        arcos += '<path class="arco" d="M' + p1[0] + ' ' + p1[1] + ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) + ' ' + p2[0] + ' ' + p2[1] + '" marker-end="url(#' + id + 'm)"/>';
      }
    });
    seq.forEach(function(x, i){
      var a = ang(i), pt = P(a, R), c = Math.cos(a), s = Math.sin(a);
      var vazio = C.anjoDe[x] == null;
      var nomeCompleto = C.por[x].nome;
      pontos += '<circle class="' + (vazio ? 'ponto vazio' : 'ponto') + '" cx="' + pt[0] + '" cy="' + pt[1] + '" r="6"><title>' + esc(nomeCompleto) + '</title></circle>';
      var tp = P(a, R + 14);
      if (radial) {
        var graus = a * 180 / Math.PI, vira = c < 0;
        textos += '<text class="rotulo" font-size="' + fs.toFixed(1) + '" x="' + tp[0] + '" y="' + tp[1] + '" dy=".35em" text-anchor="' + (vira ? 'end' : 'start') +
          '" transform="rotate(' + (vira ? graus + 180 : graus).toFixed(1) + ' ' + tp[0] + ' ' + tp[1] + ')">' + esc(curto(nomeCompleto)) + '</text>';
      } else {
        var anc = c > .12 ? 'start' : c < -.12 ? 'end' : 'middle';
        var dy = s < -.7 ? -4 : s > .7 ? 16 : 5;
        textos += '<text class="rotulo" font-size="' + fs.toFixed(1) + '" x="' + tp[0] + '" y="' + (+tp[1] + dy).toFixed(1) + '" text-anchor="' + anc + '">' + esc(curto(nomeCompleto)) + '</text>';
      }
    });
    var defs = '<defs><marker id="' + id + 'm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker></defs>';
    return {fechada: fechadas === n, svg: '<svg class="roda" viewBox="' + (-pad) + ' ' + (-vpad) + ' ' + (W + 2 * pad) + ' ' + (W + 2 * vpad) + '" role="img" aria-label="Roda do sorteio: cada seta vai do anjo para o protegido">' + defs + arcos + pontos + textos + '</svg>'};
  }

  // ---------- peças de tela ----------
  function htmlEspera(titulo){
    return '<section class="espera" aria-busy="true"><h2>' + esc(titulo) + '</h2><div class="barra" role="progressbar" aria-label="' + esc(titulo) + '"><i></i></div></section>';
  }
  function htmlGate(){
    return '<div class="gate"><h2>Painel do time</h2><p>Digite o PIN de operação da Dinâmica do Anjo.</p>' +
      '<form id="f-pin" novalidate><label class="sr" for="pin">PIN de operação</label>' +
      '<input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="• • • •" autocomplete="off" data-foco>' +
      '<button class="btn pri" type="submit">Entrar</button></form>' +
      '<div class="gate-err" role="alert">' + esc(S.gateErro) + '</div></div>';
  }
  function barra(s, n){
    var pct = n ? Math.round(s / n * 100) : 0;
    return '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + s + '" aria-label="' + s + ' de ' + n + ' já sortearam"><i style="width:' + pct + '%"></i></div>';
  }
  function caixaConfirma(txt, acao, rotulo, perigo){
    return '<div class="confirma-caixa' + (perigo ? ' perigo' : '') + '" role="alertdialog" aria-label="Confirmação"><p>' + txt + '</p><div class="acoes">' +
      '<button type="button" class="btn ' + (perigo ? 'perigo' : 'pri') + '" data-acao="' + acao + '" data-foco-conf>' + esc(rotulo) + '</button><button type="button" class="btn" data-acao="cancelar">Cancelar</button></div></div>';
  }
  // 'onde' separa a mesma confirmação em lugares diferentes da tela (topo, aviso, editar, passo5); vazio = rodapé do passo
  function confirmaAtiva(t, onde){ return !!(S.confirmar && S.confirmar.t === t && (S.confirmar.onde || '') === (onde || '')); }
  // confirmação que pede o PIN digitado (campo de senha); Enter confirma
  function caixaPin(txt, fn, rotulo, perigo){
    return '<div class="confirma-caixa' + (perigo ? ' perigo' : '') + '" role="alertdialog" aria-label="Confirmação"><p>' + txt + '</p>' +
      '<div class="campo pin-campo"><label for="pin-conf">Digite o PIN para confirmar</label>' +
      '<input id="pin-conf" type="password" inputmode="numeric" maxlength="12" autocomplete="off" data-fn="' + fn + '" value="' + esc(S.pinConf) + '" data-foco-conf></div>' +
      (S.pinErro ? '<p class="pin-err" id="pin-err" role="alert">' + esc(S.pinErro) + '</p>' : '') +
      '<div class="acoes"><button type="button" class="btn ' + (perigo ? 'perigo' : 'pri') + '" data-acao="confirmar-pin" data-fn="' + fn + '">' + esc(rotulo) + '</button>' +
      '<button type="button" class="btn" data-acao="cancelar">Cancelar</button></div></div>';
  }
  function caixaExcluirPin(nome){ return caixaPin(textoExcluir(nome), 'excluir', 'Sim, excluir de vez', true); }
  function caixaEncerrarPin(){ return caixaPin('Encerrar a dinâmica? Os alunos param de registrar mimos. Não dá para desfazer.', 'encerrar', 'Sim, encerrar a dinâmica', false); }
  function textoExcluir(nome){ return 'Excluir de vez <b>' + esc(nome) + '</b>? Some a lista, o sorteio, os mimos e o histórico. Não dá para desfazer.'; }
  // rodapé do passo: uma frase de ajuda e o botão principal; se há confirmação aberta para este botão, ela ocupa o lugar
  function rodape(ajuda, botoes, t, caixa){
    if (t && confirmaAtiva(t, '') && caixa) return '<div class="rodape-passo">' + caixa + '</div>';
    return '<div class="rodape-passo"><p class="ajuda">' + ajuda + '</p><div class="acoes">' + botoes + '</div></div>';
  }
  function botaoRemover(id, rotulo, perigo){
    var c = S.confirmar;
    if (c && c.t === 'remover' && c.id === id) {
      return '<span class="confirma confirma-troca"><span class="o-que">' + esc(consequencia(id)) + '</span><span class="botoes"><button type="button" class="btn mini perigo" data-acao="remover" data-id="' + id + '" data-foco-conf>Sim, confirmar</button><button type="button" class="btn mini" data-acao="cancelar">Cancelar</button></span></span>';
    }
    return '<button class="btn mini' + (perigo ? ' perigo' : '') + '" data-acao="pedir-remover" data-id="' + id + '">' + esc(rotulo) + '</button>';
  }
  function contador(chave){
    var v = S[chave].dias;
    return '<div class="contador-dias" role="group" aria-label="Quantidade de dias">' +
      '<button type="button" id="' + chave + '-menos" data-acao="dias" data-k="' + chave + '" data-d="-1" aria-label="Um dia a menos"' + (v <= 1 ? ' disabled' : '') + '>−</button>' +
      '<span aria-live="polite">' + v + '</span>' +
      '<button type="button" id="' + chave + '-mais" data-acao="dias" data-k="' + chave + '" data-d="1" aria-label="Um dia a mais"' + (v >= 30 ? ' disabled' : '') + '>+</button></div>';
  }

  var BTN_VOLTAR = '<button type="button" class="btn voltar" data-acao="inicio"><span class="seta-v" aria-hidden="true">←</span> Minhas dinâmicas</button>';

  // ---------- Início: minhas dinâmicas ----------
  function cartaoDinamica(e){
    var pessoas = e.pessoas || 0, s = e.sortearam || 0, enc = e.status === 'encerrado';
    var cls = e.status === 'aberto' ? 'alerta' : e.status === 'fechado' ? 'ok' : 'neutro';
    var meta = enc
      ? 'Encerrada · ' + s + ' ' + plural(s, 'anjo', 'anjos') + ' · começou em ' + esc(fmtDM(e.inicio))
      : 'Começa ' + esc(fmtDM(e.inicio)) + ' · ' + e.dias + ' ' + plural(e.dias, 'dia', 'dias') + ' · <span class="pill ' + cls + '">' + esc(STATUS_NOME[e.status] || e.status) + '</span>';
    var corpo = '<div><b>' + esc(e.nome) + '</b><p class="meta">' + meta + '</p>';
    if (e.status === 'aberto') corpo += barra(s, pessoas) + '<p class="meta">' + s + ' de ' + pessoas + ' já sortearam</p>';
    corpo += '</div>';
    var c = S.confirmar, pedindo = c && c.t === 'excluir-ini' && c.cod === e.codigo;
    var botoes = '<div class="acoes"><button class="btn' + (e.status === 'aberto' || e.status === 'fechado' ? ' pri' : '') + '" data-acao="abrir" data-cod="' + esc(e.codigo) + '">Abrir</button>' +
      '<button class="btn perigo" data-acao="pedir" data-t="excluir-ini" data-cod="' + esc(e.codigo) + '">Excluir</button></div>';
    return '<div class="din-card">' + corpo + botoes +
      (pedindo ? '<div style="grid-column:1/-1">' + caixaExcluirPin(e.nome) + '</div>' : '') + '</div>';
  }
  function htmlInicio(){
    var ev = S.eventos;
    var andamento = ev.filter(function(e){ return e.status !== 'encerrado'; });
    var fim = ev.filter(function(e){ return e.status === 'encerrado'; });
    var h = '<div class="din-topo"><div><h2>Minhas dinâmicas</h2><p class="meta">' + (ev.length ? 'Escolha uma dinâmica ou crie uma nova.' : 'Nenhuma dinâmica criada ainda.') + '</p></div>' +
      (ev.length ? '<button class="btn pri grande" data-acao="criar-novo">+ Criar dinâmica</button>' : '') + '</div>';
    if (!ev.length) {
      return h + '<section class="cartao vazio-geral"><h3>Vamos criar a primeira dinâmica</h3>' +
        '<p class="ajuda">Cada dinâmica tem a sua lista do credenciamento, o seu sorteio e o seu QR para o telão. Crie a primeira para começar.</p>' +
        '<button class="btn pri grande" data-acao="criar-novo">+ Criar dinâmica</button></section>';
    }
    if (andamento.length) h += '<p class="secao-tit">Em andamento</p><div class="lista-din">' + andamento.map(cartaoDinamica).join('') + '</div>';
    if (fim.length) h += '<p class="secao-tit">Encerradas</p><div class="lista-din">' + fim.map(cartaoDinamica).join('') + '</div>';
    return h;
  }

  // ---------- Passo 1: criar ----------
  function listaPassosEstatica(){
    return '<ol class="passos" aria-label="Passos da dinâmica">' + PASSO_NOME.map(function(n, i){
      return '<li' + (i === 0 ? ' class="atual" aria-current="step"' : '') + '><span class="fixo"><span class="n">' + (i + 1) + '</span>' + n + '</span></li>';
    }).join('') + '</ol>';
  }
  function htmlCriar(){
    return BTN_VOLTAR +
      '<div class="din-topo"><div><h2>Nova dinâmica</h2><p class="meta">Três informações. Dá para mudar depois em "Editar".</p></div></div>' +
      listaPassosEstatica() +
      '<form id="f-criar" novalidate><div class="cartao pilha" style="max-width:560px">' +
      '<div class="campo"><label for="n-nome">Nome da dinâmica</label><input id="n-nome" type="text" autocomplete="off" maxlength="80" placeholder="Ex.: FOP T15 · Fortaleza" value="' + esc(S.novo.nome) + '"></div>' +
      '<div class="campo"><label for="n-inicio">Primeiro dia</label><input id="n-inicio" type="date" value="' + esc(S.novo.inicio) + '"></div>' +
      '<div class="campo"><label id="rot-n-dias">Quantos dias tem a imersão</label>' + contador('novo') + '</div></div>' +
      '<div class="rodape-passo"><p class="ajuda">O sorteio só abre no passo 3. Nada aparece para os alunos ainda.</p>' +
      '<div class="acoes"><button type="button" class="btn" data-acao="inicio">Cancelar</button><button type="submit" class="btn pri grande">Criar e ir para a lista →</button></div></div></form>';
  }

  // ---------- dentro de uma dinâmica: cabeçalho e passos ----------
  function vistaAtual(){
    var st = S.painel.evento.status, cur = PASSO_DE[st], v = S.vista;
    if (v == null) return cur;
    var max = st === 'aberto' ? 4 : cur;           // com o sorteio aberto, a imersão já pode ser vista (os mimos começam no Dia 1)
    return v < 2 || v > max ? cur : v;
  }
  function htmlPassos(){
    var st = S.painel.evento.status, cur = PASSO_DE[st], v = vistaAtual();
    var h = '<ol class="passos" aria-label="Passos da dinâmica">';
    for (var i = 1; i <= 5; i++) {
      var alcanca = i <= cur || (i === 4 && st === 'aberto');
      var feito = i < cur;
      var cls = i === v ? 'atual' : feito ? 'feito' : i === cur ? 'andamento' : '';
      var num = (i === v && i !== 1) || !feito ? i : '✓';
      var conteudo = '<span class="n">' + num + '</span><span class="rot-p">' + PASSO_NOME[i - 1] + '</span>';
      h += '<li' + (cls ? ' class="' + cls + '"' : '') + '>';
      if (i === 1) h += '<button type="button" data-acao="editar" title="Mudar nome, primeiro dia e quantidade de dias">' + conteudo + '</button>';
      else if (alcanca) h += '<button type="button" data-acao="passo" data-p="' + i + '"' + (i === v ? ' aria-current="step"' : '') + '>' + conteudo + '</button>';
      else h += '<span class="fixo" aria-disabled="true">' + conteudo + '</span>';
      h += '</li>';
    }
    return h + '</ol>';
  }
  function htmlEditar(){
    var h = '<form id="f-cfg" novalidate class="cartao pilha" style="max-width:560px;margin-bottom:18px"><h3>Editar a dinâmica</h3>' +
      '<div class="campo"><label for="c-nome">Nome da dinâmica</label><input id="c-nome" type="text" maxlength="80" autocomplete="off" value="' + esc(S.cfg.nome) + '"></div>' +
      '<div class="campo"><label for="c-inicio">Primeiro dia</label><input id="c-inicio" type="date" value="' + esc(S.cfg.inicio) + '"></div>' +
      '<div class="campo"><label>Quantos dias tem a imersão</label>' + contador('cfg') + '</div>' +
      '<div class="acoes"><button type="submit" class="btn pri">Salvar</button><button type="button" class="btn" data-acao="editar-fechar">Cancelar</button></div>';
    h += confirmaAtiva('excluir', 'editar')
      ? caixaExcluirPin(S.painel.evento.nome)
      : '<div><button type="button" class="link-btn" data-acao="pedir" data-t="excluir" data-onde="editar" style="color:var(--bad)">Excluir esta dinâmica</button></div>';
    return h + '</form>';
  }
  function topoEvento(){
    var P = S.painel, ev = P.evento, C = S.C, dh = diaHoje(ev);
    var n = C.ativos.length;
    var meta = ev.status === 'encerrado'
      ? 'Encerrada' + (dataEncerramento() ? ' em ' + dataEncerramento() : '') + ' · ' + C.sortearam.length + ' ' + plural(C.sortearam.length, 'anjo', 'anjos') + ' · ' + C.totalMimos + ' ' + plural(C.totalMimos, 'mimo', 'mimos')
      : 'Começa ' + esc(fmtDM(ev.inicio)) + ' · ' + ev.dias + ' ' + plural(ev.dias, 'dia', 'dias') + (ev.dias > 1 && dh ? ' · hoje é o dia ' + dh : '') + ' · ' + n + ' ' + plural(n, 'pessoa', 'pessoas');
    return BTN_VOLTAR +
      '<div class="din-topo"><div><h2>' + esc(ev.nome) + '</h2><p class="meta">' + meta +
      '<button type="button" class="link-btn" data-acao="editar" aria-expanded="' + S.editar + '">Editar</button></p></div>' +
      (ev.status !== 'encerrado' ? '<div class="acoes"><button type="button" class="btn encerrar" data-acao="pedir" data-t="encerrar" data-onde="topo">Encerrar a dinâmica</button></div>' : '') + '</div>' +
      (confirmaAtiva('encerrar', 'topo') ? '<div class="caixa-topo">' + caixaEncerrarPin() + '</div>' : '') +
      (S.editar ? htmlEditar() : '') + htmlPassos();
  }
  function dataEncerramento(){
    var log = (S.painel && S.painel.log) || [];
    for (var i = 0; i < log.length; i++) if (/Dinâmica encerrada/.test(log[i].txt)) { var d = new Date(log[i].em); if (!isNaN(d.getTime())) { var p = partes(d); return p.day + '/' + p.month; } }
    return '';
  }

  // ---------- Passo 2: lista do credenciamento ----------
  function htmlProblemas(){
    var pr = S.problemas;
    if (!pr.length) return '';
    return '<div class="problema" role="alert"><b>' + pr.length + ' ' + plural(pr.length, 'linha ficou', 'linhas ficaram') + ' de fora:</b><ul>' + pr.map(function(x){
      var m = /sobrenome/i.test(x.motivo) ? 'está sem sobrenome. Corrija e salve de novo.' : /repetid/i.test(x.motivo) ? 'já está na lista.' : esc(x.motivo) + '.';
      return '<li>“' + esc(x.nome) + '” ' + m + '</li>';
    }).join('') + '</ul></div>';
  }
  function chipPessoa(p, comX){
    var c = S.confirmar;
    if (comX && c && c.t === 'remover' && c.id === p.id) {
      return '<li class="chip conf"><span>Tirar ' + esc(p.nome) + '?</span><button class="btn mini perigo" data-acao="remover" data-id="' + p.id + '" data-foco-conf>Sim, tirar</button><button class="btn mini" data-acao="cancelar">Não</button></li>';
    }
    return '<li class="chip">' + esc(p.nome) + (comX ? '<button class="x" data-acao="pedir-remover" data-id="' + p.id + '" aria-label="Tirar ' + esc(p.nome) + ' da lista">×</button>' : '') + '</li>';
  }
  function listaForaHtml(rol, rotuloTopo){
    var C = S.C, st = S.painel.evento.status;
    if (!C.fora.length) return '';
    return '<p class="secao-tit" style="margin-top:18px">' + rotuloTopo + '</p><ul class="lista-linhas" data-rol="' + rol + '">' + C.fora.map(function(p){
      return '<li><span>' + esc(p.nome) + '</span>' + (st === 'encerrado' ? '' : '<button class="btn mini" data-acao="voltar" data-id="' + p.id + '">Colocar de volta</button>') + '</li>';
    }).join('') + '</ul>';
  }
  function htmlLista(){
    var C = S.C, st = S.painel.evento.status, n = C.ativos.length, aberta = st === 'lista';
    var esq, dir;
    if (aberta) {
      esq = '<div class="cartao pilha"><div><h3>Cole a lista do credenciamento</h3><p class="ajuda">Um nome completo por linha, igual ao cadastro. Dá para colar direto da planilha. Se vierem várias colunas, vale a primeira.</p></div>' +
        '<label class="sr" for="texto-lista">Nomes do credenciamento</label>' +
        '<textarea id="texto-lista" rows="10" spellcheck="false" placeholder="Maria da Silva&#10;João Pereira Lima&#10;Ana Clara de Souza">' + esc(S.textoLista) + '</textarea>' +
        '<div class="acoes"><button class="btn pri" data-acao="carregar-lista">Conferir e salvar</button></div></div>';
    } else {
      esq = '<div class="cartao pilha"><div><h3>Lista do credenciamento</h3><p class="ajuda">A lista fica travada depois que o sorteio abre. Para incluir alguém que chegou, use "Incluir pessoa" no passo do sorteio.</p></div></div>';
    }
    dir = '<div class="cartao pilha"><div><h3>' + (n ? n + ' ' + plural(n, 'pessoa', 'pessoas') + ' na lista' : 'Nenhuma pessoa na lista') + '</h3>' +
      '<p class="ajuda">' + (!n ? 'Cole os nomes ao lado e toque em "Conferir e salvar". Cada linha precisa de nome e sobrenome.' : aberta ? 'Toque no × para tirar alguém.' : 'Quem está no jogo agora.') + '</p></div>' +
      (S.resultadoLista && aberta ? '<p class="aviso-ok" role="status">' + esc(S.resultadoLista) + '</p>' : '') +
      (aberta ? htmlProblemas() : '') + htmlParecidos() +
      (n ? '<ul class="chips" data-rol="chips-lista">' + C.ativos.slice().sort(cmpNome).map(function(p){ return chipPessoa(p, aberta); }).join('') + '</ul>' : '') +
      (aberta ? listaForaHtml('lista-fora', 'Saíram da lista') : '') + '</div>';
    var rod;
    if (aberta) {
      rod = rodape(n < 3 ? 'Carregue pelo menos 3 pessoas para abrir o sorteio.' : 'Ao abrir o sorteio, o QR fica disponível para o telão e os alunos já podem sortear.',
        '<button class="btn pri grande" data-acao="status" data-st="aberto"' + (n < 3 ? ' disabled' : '') + '>Abrir o sorteio →</button>');
    } else {
      rod = rodape('O sorteio já foi aberto. A lista segue no passo do sorteio.', '<button class="btn pri grande" data-acao="passo" data-p="3">Continuar →</button>');
    }
    return '<div class="grade-2">' + esq + dir + '</div>' + rod;
  }

  // ---------- Passo 3: sorteio ----------
  function linhasSorteio(){
    var C = S.C, q = norm(S.busca);
    var lin = C.sortearam.filter(function(a){
      if (!q) return true;
      var b = C.por[a.protegido];
      return norm(a.nome).indexOf(q) >= 0 || (b && norm(b.nome).indexOf(q) >= 0);
    });
    if (!lin.length) return '<tr><td colspan="5" class="vazio">' + (S.busca ? 'Nenhum nome encontrado.' : 'Ninguém sorteou ainda. Quando o primeiro aluno sortear, a linha aparece aqui.') + '</td></tr>';
    return lin.map(function(a){
      var b = C.por[a.protegido];
      return '<tr><td class="n">' + (a.ordem == null ? '–' : a.ordem) + '</td><td>' + esc(a.nome) + '</td><td class="seta" aria-label="tirou">→</td><td>' + esc(b ? b.nome : '–') +
        (a.trocado ? ' <span class="pill alerta">trocado</span>' : '') + (a.revelou ? '' : ' <span class="pill neutro">ainda não viu</span>') + '</td><td class="quando">' + esc(fmtQuando(a.sorteado_em)) + '</td></tr>';
    }).join('');
  }
  function htmlIncluir(){
    return '<form id="f-incluir" novalidate class="linha-form"><div class="campo"><label for="novo-nome">Nome completo de quem chegou</label>' +
      '<input id="novo-nome" type="text" autocomplete="off" placeholder="Nome e sobrenome" value="' + esc(S.novoNome) + '" data-foco></div>' +
      '<button class="btn pri" type="submit">Incluir</button><button class="btn" type="button" data-acao="incluir-fechar">Cancelar</button></form>';
  }
  function htmlCopia(){
    if (!S.copia) return '';
    return '<div class="copia"><p>Não deu para copiar sozinho. Selecione o texto abaixo e copie.</p><label class="sr" for="copia-txt">Mensagem para o grupo</label><textarea id="copia-txt" rows="3" readonly>' + esc(S.copia) + '</textarea></div>';
  }
  function htmlSorteio(){
    var C = S.C, ev = S.painel.evento, st = ev.status, n = C.ativos.length, s = C.sortearam.length;
    var h = '';
    if (st === 'aberto' || st === 'fechado') {
      h += '<div class="acao-telao"><div class="txt"><b>QR do telão</b><span>Abre numa aba só do QR. Leve essa aba para o projetor: ela não volta para o painel.</span></div>' +
        '<button class="btn pri grande" data-acao="telao">Abrir o QR do telão ↗</button>' +
        '<button class="btn" data-acao="copiar-link">Copiar link para o grupo</button></div>' + htmlCopia();
    }
    h += '<div class="kpis"><div class="kpi"><span class="num">' + s + '<small> de ' + n + '</small></span><span class="rot">já sortearam</span>' + barra(s, n) + '</div>' +
      '<div class="kpi' + (C.pend.length ? '' : ' ok') + '"><span class="num">' + C.pend.length + '</span><span class="rot">ainda não sortearam</span></div></div>';
    var caixaFech = caixaConfirma(esc('Fechar o sorteio? Quem ainda não sorteou sai do jogo' + (C.pend.length ? ' (' + (C.pend.length === 1 ? '1 pessoa' : C.pend.length + ' pessoas') + ')' : '') + ', e a roda fecha.'), 'confirmar-fechar', 'Sim, fechar o sorteio');
    if (st === 'aberto' && !C.pend.length && s >= 3) {
      h += '<div class="aviso-fechar" role="status"><div class="txt"><b>Todo mundo já sorteou.</b><span>Feche o sorteio para seguir para a imersão.</span></div>' +
        (confirmaAtiva('fechar', 'aviso') ? caixaFech : '<button class="btn pri grande" data-acao="pedir" data-t="fechar" data-onde="aviso">Fechar o sorteio e ir para a imersão →</button>') + '</div>';
    }
    h += htmlParecidos();
    h += '<div class="' + (st === 'aberto' || st === 'fechado' ? 'grade-sorteio' : 'grade-2') + '">';
    if (st === 'aberto' || st === 'fechado') {
      h += '<div class="cartao"><h3>Ainda não sortearam</h3>';
      if (C.pend.length) {
        h += '<ul class="lista-linhas" data-rol="pend">' + C.pend.slice().sort(cmpNome).map(function(p){
          return '<li><span>' + esc(p.nome) + '</span>' + (st === 'aberto' ? botaoRemover(p.id, 'Não veio') : '') + '</li>';
        }).join('') + '</ul>';
      } else h += '<p class="ajuda mt">Todo mundo que está no jogo já sorteou.</p>';
      if (C.pend.length && st === 'aberto') h += '<p class="ajuda mt">“Não veio” tira a pessoa do sorteio. Se alguém já tinha tirado o nome dela, essa pessoa ganha outro protegido na hora.</p>';
      h += '<p class="ajuda mt">Chegou alguém fora da lista? <button type="button" class="link-btn" data-acao="incluir-abrir" aria-expanded="' + S.incluirAberto + '">Incluir pessoa</button></p>' +
        (S.incluirAberto ? htmlIncluir() : '') + '</div>';
    }
    h += '<div class="cartao"><h3>Quem tirou quem</h3><label class="sr" for="busca">Buscar um nome</label>' +
      '<input id="busca" class="busca" type="search" autocomplete="off" placeholder="Buscar um nome. Ex.: quem é o anjo da Juliana?" value="' + esc(S.busca) + '">' +
      '<div class="rolagem" data-rol="tirou"><table class="tabela"><caption class="sr">Quem tirou quem, na ordem do sorteio</caption><thead><tr><th class="n">Nº</th><th>Anjo</th><th class="seta"></th><th>Protegido</th><th>Quando (Brasília)</th></tr></thead>' +
      '<tbody id="linhas-sorteio">' + linhasSorteio() + '</tbody></table></div></div></div>';

    h += htmlTrocas() + htmlHistorico();
    h += '<div class="discreto-bloco"><p class="secao-tit" style="margin-top:14px">Na urna (só o time vê)</p>' +
      '<p class="ajuda">Nomes que ninguém tirou ainda.</p>' +
      (C.urna.length ? '<ul class="chips discreto" data-rol="urna">' + C.urna.map(function(p){ return '<li class="chip">' + esc(p.nome) + '</li>'; }).join('') + '</ul>'
        : '<p class="ajuda mt">A urna está vazia: todo mundo tem um anjo.</p>') +
      listaForaHtml('fora', 'Saíram do jogo') + '</div>';
    if (st !== 'lista') {
      h += '<p class="ajuda" style="margin-top:16px">Endereço do aluno: <a href="' + esc(linkAluno(ev.codigo)) + '" target="_blank" rel="noopener" style="color:var(--accent-soft);word-break:break-all">' + esc(linkAluno(ev.codigo)) + '</a></p>';
    }

    if (st === 'aberto') {
      h += rodape('Fechar o sorteio: quem não sorteou sai do jogo, e a roda fecha com todo mundo que ficou.' + (s < 3 ? ' Para fechar, pelo menos 3 pessoas precisam ter sorteado.' : ''),
        '<button class="btn pri grande" data-acao="pedir" data-t="fechar"' + (s < 3 ? ' disabled' : '') + '>Fechar o sorteio →</button>',
        'fechar', caixaFech);
    } else if (st === 'fechado') {
      h += rodape('O sorteio está fechado e a roda fechou com quem ficou. Se precisar, dá para reabrir.',
        '<button class="btn" data-acao="status" data-st="aberto">Reabrir o sorteio</button><button class="btn pri grande" data-acao="passo" data-p="4">Ir para a imersão →</button>');
    } else {
      h += rodape('A dinâmica foi encerrada.', '<button class="btn pri grande" data-acao="passo" data-p="4">Continuar →</button>');
    }
    return h;
  }

  // ---------- Passo 4: imersão ----------
  function situacao(a, d){
    var C = S.C, ev = S.painel.evento, b = a.protegido, dh = diaReal(ev);
    var dados = C.mimosAnjo[a.id + ':' + d] || 0, rec = C.recebi[b + ':' + d] || 0;
    var hojeAinda = d === dh && horaBR() < HORA_CORTE;
    if (d > dh) return {peso: 4, cls: 'neutro', txt: 'O dia ainda não chegou'};
    if (!a.revelou) return {peso: 1, cls: 'alerta', txt: 'Ainda não viu o protegido'};
    if (dados === 0 && !rec) {
      if (hojeAinda) return {peso: 2, cls: 'neutro', txt: 'Dia em andamento'};
      return {peso: 0, cls: 'risco', txt: (d === dh ? 'Sem mimo hoje' : 'Sem mimo neste dia') + '. Foi embora?'};
    }
    return {peso: 3, cls: 'ok', txt: 'Em dia'};
  }
  function htmlRoda(){
    var C = S.C, seq = ordemDesenho(C);
    var roda = rodaSVG(seq, C);
    var h = '<div class="roda-hist"><section class="cartao">';
    if (roda) {
      h += '<h3>' + (roda.fechada ? 'A roda está fechada' : 'A roda se formando') + '</h3>' +
        '<p class="ajuda">' + (roda.fechada ? 'Cada seta vai do anjo para o protegido. Todo mundo tem um anjo e um protegido.' : 'Cada seta vai do anjo para o protegido. Onde falta seta, alguém ainda não sorteou. Ponto vazio: ninguém tirou essa pessoa ainda.') + '</p>' + roda.svg;
    } else h += '<h3>Roda</h3><p class="ajuda">A roda aparece quando houver pelo menos duas pessoas no jogo.</p>';
    return h + '</section></div>';
  }
  function htmlImersao(){
    var C = S.C, ev = S.painel.evento, st = ev.status, d = S.diaSel, anjos = C.sortearam, dh = diaHoje(ev);
    var botoes = '';
    for (var i = 1; i <= ev.dias; i++) botoes += '<button type="button" data-acao="dia" data-dia="' + i + '" aria-pressed="' + (i === d) + '">Dia ' + i + (i === dh ? ' · hoje' : '') + '</button>';
    var h = '';
    if (st === 'aberto') {
      var np = C.pend.length;
      h += '<div class="aviso-sorteio" role="status"><div class="txt"><b>O sorteio ainda está aberto: ' + (np ? np + ' ' + plural(np, 'pessoa não sorteou', 'pessoas não sortearam') : 'todo mundo já sorteou') + '.</b>' +
        '<span>Os mimos já valem. Quando quiser, feche o sorteio no passo 3.</span></div>' +
        '<button type="button" class="btn pri" data-acao="passo" data-p="3">Ir para o passo 3 →</button></div>';
    }
    h += '<div class="passo-cab"><h3>Mimos do dia</h3><div class="dias" role="group" aria-label="Dia da imersão">' + botoes + '</div></div>';
    var nomeDia = d === dh ? 'hoje' : 'no dia ' + d;
    if (!anjos.length) {
      h += '<section class="cartao"><p class="ajuda">Ninguém sorteou ainda. Os mimos aparecem aqui depois do primeiro sorteio.</p></section>';
    } else {
      var prots = anjos.map(function(a){ return a.protegido; });
      var semMimo = prots.filter(function(b){ return !C.mimosProt[b + ':' + d]; }).length;
      var conf = prots.filter(function(b){ return C.recebi[b + ':' + d]; }).length;
      var passouDoCorte = d < dh || (dh > 0 && d === dh && horaBR() >= HORA_CORTE) || diaReal(ev) > ev.dias;
      var linhas = anjos.map(function(a){ return {a: a, b: C.por[a.protegido], st: situacao(a, d)}; })
        .sort(function(x, y){ return x.st.peso - y.st.peso || cmpNome(x.a, y.a); });
      var mimosNoDia = C.mimosDia[d] || 0;
      h += '<div class="kpis">' +

  // ---------- desenho da página, guardando foco, cursor e rolagem ----------
  function cabecalho(){
    var logado = S.fase !== 'gate';
    $('conn').hidden = !logado;
    $('conn').className = 'conn' + (logado && S.atualizadoEm ? ' on' : '');
    $('conn-txt').textContent = logado && S.atualizadoEm ? 'Atualizado às ' + fmtHora(S.atualizadoEm) : '';
    $('b-atualizar').hidden = !logado;
  }
  function render(){
    var raiz = $('raiz'), foco = null, rol = {};
    var ae = document.activeElement;
    if (ae && ae.id && raiz.contains(ae)) {
      foco = {id: ae.id};
      try { foco.ini = ae.selectionStart; foco.fim = ae.selectionEnd; foco.top = ae.scrollTop; } catch (e) {}
    }
    raiz.querySelectorAll('[data-rol]').forEach(function(el){ rol[el.getAttribute('data-rol')] = [el.scrollTop, el.scrollLeft]; });
    var y = window.scrollY;
    var html;
    if (S.fase === 'gate') html = htmlGate();
    else if (S.fase === 'inicio') html = htmlInicio();
    else if (S.fase === 'criar') html = htmlCriar();
    else html = S.painel ? htmlEvento() : htmlEspera('Carregando a dinâmica…');
    raiz.innerHTML = html;
    raiz.querySelectorAll('[data-rol]').forEach(function(el){ var r = rol[el.getAttribute('data-rol')]; if (r) { el.scrollTop = r[0]; el.scrollLeft = r[1]; } });
    window.scrollTo(0, y);
    if (foco) {
      var el = $(foco.id);
      if (el) { try { el.focus({preventScroll:true}); if (foco.ini != null && el.setSelectionRange) el.setSelectionRange(foco.ini, foco.fim); if (foco.top) el.scrollTop = foco.top; } catch (e) {} }
    }
    cabecalho();
    var ct = $('copia-txt'); if (ct && S.copia && S.copiaSel) { S.copiaSel = false; ct.focus(); ct.select(); }
  }
  function renderComFoco(){
    render();
    var f = $('raiz').querySelector('[data-foco-conf]') || $('raiz').querySelector('[data-foco]');
    if (f) { try { f.focus(); } catch (e) {} }

  function noTopo(){ window.scrollTo(0, 0); }

  async function entrarComPin(pin, auto){
    S.busy = true; esperar(true, 'Conferindo o PIN…');
    $('raiz').innerHTML = htmlEspera('Conferindo o PIN…');
    try {
      var lista = await rpc('gamificacao_anjo_t_eventos', {p_pin: pin});
      S.pin = pin; guardarPin(pin); S.eventos = lista || []; S.gateErro = '';
      S.busy = false; esperar(false);
      S.atualizadoEm = new Date();
      var cod = '';
      try { cod = (new URLSearchParams(location.search).get('e') || '').toLowerCase().replace(/[^a-z0-9]/g, ''); } catch (e) {}
      if (cod && S.eventos.some(function(x){ return x.codigo === cod; })) await abrirEvento(cod);
      else {
        if (cod) { setUrl(''); toast('Não achamos essa dinâmica. Escolha uma na lista.', 'err'); }
        S.fase = 'inicio'; render();
      }
    } catch (e) {
      S.busy = false; esperar(false);
      if (ehPin(e)) { irParaGate(auto ? '' : 'PIN inválido.'); }
      else { S.gateErro = textoErro(e); S.fase = 'gate'; render(); }

  async function carregarEventos(){

  function limparDinamica(){

    S.pinConf = ''; S.pinErro = ''; S.histTudo = false;

  // depois de uma ação, usa o JSON que a própria função devolveu
  function aplicarPainel(P){

    render();
  }
  // o que acontece se esta pessoa sair, explicado com os nomes (mesma regra do banco)
  function consequencia(id){
    var ps = (S.painel && S.painel.pessoas) || [], por = {};
    ps.forEach(function(p){ por[p.id] = p; });
    var x = por[id]; if (!x) return 'Tirar do jogo?';
    var pn = function(nome){ return String(nome || '').split(' ')[0]; };
    var anjo = ps.filter(function(p){ return p.ativo && p.protegido === id; })[0];
    var prot = x.protegido != null ? por[x.protegido] : null;
    var n = pn(x.nome);
    if (anjo && prot) return n + ' sai do jogo. ' + pn(anjo.nome) + ', que cuidava de ' + n + ', passa a cuidar de ' + pn(prot.nome) + '. Ninguém fica sem anjo. ' + pn(anjo.nome) + ' vê o aviso da troca ao abrir a tela.';
    if (anjo) return n + ' sai do jogo. ' + pn(anjo.nome) + ' tinha tirado ' + n + ' e ganha outro protegido na hora. ' + pn(anjo.nome) + ' vê o aviso da troca ao abrir a tela.';
    if (prot) return n + ' sai do jogo. ' + pn(prot.nome) + ' volta para a urna, para outra pessoa tirar.';
    return n + ' sai do sorteio. Ninguém tinha tirado ' + n + ', então nada muda para os outros.';
  }
  // trocas feitas (saídas e entradas), do histórico do banco

      trocas.map(function(l){ return '<li><span class="quando">' + esc(fmtQuando(l.em)) + '</span><span>' + esc(l.txt) + '</span></li>'; }).join('') + '</ul></div>';
  }
  // histórico completo do banco (sorteio, trocas e o que os alunos fazem): 15 mais novas, com "Ver tudo"

  // grafia padronizada: iniciais maiúsculas, "da/de/do/das/dos/e" minúsculos (pedido do Carlos, 30/10)
  var LIGACOES = ['da', 'de', 'do', 'das', 'dos', 'e', 'di', 'du', 'del'];
  function fmtNome(n){
    return String(n || '').replace(/\s+/g, ' ').trim().toLocaleLowerCase('pt-BR').split(' ').map(function(w, i){
      if (i > 0 && LIGACOES.indexOf(w) >= 0) return w;
      return w.split('-').map(function(x){ return x ? x.charAt(0).toLocaleUpperCase('pt-BR') + x.slice(1) : x; }).join('-');
    }).join(' ');
  }
  function parseLista(txt){
    return String(txt || '').split(/\r?\n/).map(function(l){
      return fmtNome(l.split('\t')[0].replace(/^["'\s]+|["'\s]+$/g, ''));
    }).filter(Boolean);
  }
  // possíveis repetidos: mesmo primeiro nome e mesmo último sobrenome, com o nome completo diferente
  function palavrasNome(n){
    return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z\s]/g, ' ')
      .split(/\s+/).filter(function(w){ return w && LIGACOES.indexOf(w) < 0; });
  }
  function htmlParecidos(){
    var grupos = {}, lista = [];
    (S.C ? S.C.ativos : []).forEach(function(p){
      var w = palavrasNome(p.nome); if (w.length < 2) return;
      var k = w[0] + '|' + w[w.length - 1];
      (grupos[k] = grupos[k] || []).push(p);
    });
    Object.keys(grupos).forEach(function(k){ if (grupos[k].length > 1) lista.push(grupos[k]); });
    if (!lista.length) return '';
    return '<div class="problema" role="status"><b>Confira: pode ser a mesma pessoa.</b> Os nomes abaixo têm o mesmo primeiro nome e o mesmo sobrenome. Se for a mesma pessoa, tire um deles.<ul>' +
      lista.map(function(g){
        return '<li>' + g.map(function(p){ return '<span class="parecido">' + esc(p.nome) + ' ' + botaoRemover(p.id, 'Tirar') + '</span>'; }).join(' ') + '</li>';
      }).join('') + '</ul></div>';
  }
  async function carregarLista(){
    var nomes = parseLista(S.textoLista);
    if (!nomes.length) { toast('Cole os nomes antes de salvar.', 'err'); var t = $('texto-lista'); if (t) t.focus(); return; }
    var r = await exec('gamificacao_anjo_t_lista', {p_evento: S.codigo, p_nomes: nomes}, 'Conferindo ' + nomes.length + ' ' + plural(nomes.length, 'nome', 'nomes') + '…');
    if (!r) return;
    var res = r.d || {}, add = res.adicionados || 0, prob = res.problemas || [];
    S.problemas = prob;
    S.resultadoLista = add + ' ' + plural(add, 'pessoa incluída', 'pessoas incluídas') + (prob.length ? ', e ' + prob.length + ' ' + plural(prob.length, 'linha ficou', 'linhas ficaram') + ' de fora.' : '.');
    S.textoLista = prob.filter(function(x){ return /sobrenome/i.test(x.motivo); }).map(function(x){ return x.nome; }).join('\n');
    var p = await exec('gamificacao_anjo_t_painel', {p_evento: S.codigo}, 'Atualizando a lista…');

  // o PIN digitado na caixa é o que vai na chamada (não o guardado)
  async function excluir(cod, pin){
    var r = await exec('gamificacao_anjo_t_excluir', {p_evento: cod, p_pin: pin}, 'Excluindo a dinâmica…', {pinCaixa:true});
    if (!r) {
      if (S.pinErro) { render(); focoPin(); return; }
      S.confirmar = null; render(); return;
    }
    S.eventos = r.d || []; S.atualizadoEm = new Date();
    var estavaDentro = S.fase === 'evento';
    limparDinamica(); S.fase = 'inicio'; setUrl('');
    render(); if (estavaDentro) noTopo();
    toast('Dinâmica excluída.', 'ok');
  }

  function confirmarComPin(fn){
    var c = S.confirmar; if (!c || S.confirmando) return;
    var f = $('pin-conf'), pin = String((f ? f.value : S.pinConf) || '').trim(), job = null;
    S.pinConf = pin;
    if (!pin) { S.pinErro = 'Digite o PIN.'; render(); focoPin(); return; }
    S.pinErro = '';
    if (fn === 'excluir') job = excluir(c.cod || S.codigo, pin);
    else if (fn === 'encerrar') job = mudarStatus({p_status: 'encerrado', p_pin: pin}, 'Dinâmica encerrada.', 'Encerrando a dinâmica…', true);
    if (job) { S.confirmando = true; job.then(function(){ S.confirmando = false; }, function(){ S.confirmando = false; }); }
  }

  // ---------- QR no telão e link para o grupo ----------
  function mensagemGrupo(){
    return 'Dinâmica do Anjo: sorteie e acompanhe seu protegido por aqui: ' + linkAluno(S.codigo) + '. Entre com seu nome completo, igual ao cadastro.';
  }
  async function copiarLink(){
    var txt = mensagemGrupo();
    try {
      await navigator.clipboard.writeText(txt);
      S.copia = ''; render(); toast('Mensagem copiada. É só colar no grupo.', 'ok');
    } catch (e) {
      S.copia = txt; S.copiaSel = true; render();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (x) {}
      if (ok) { S.copia = ''; render(); toast('Mensagem copiada. É só colar no grupo.', 'ok'); }
    }
  }
  // O telão é uma página à parte (anjo-telao.html), aberta numa aba própria: se alguém sair dela por engano,
  // o telão não mostra o painel com quem tirou quem.
  function linkTelao(cod){
    try { return new URL('anjo-telao.html?e=' + encodeURIComponent(cod), location.href).href; }
    catch (e) { return 'anjo-telao.html?e=' + cod; }
  }
  function abrirTelao(){
    if (!S.painel) return;
    var url = linkTelao(S.codigo), w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { try { w.opener = null; } catch (e) {} toast('O QR abriu numa aba nova. Leve essa aba para o telão.', 'ok'); }
    else toast('O navegador bloqueou a aba nova. Libere pop-ups para este site ou abra: ' + url, 'err');
  }

  // ---------- eventos da página ----------
  document.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('[data-acao]') : null;
    if (!b || b.disabled) return;
    var a = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
    id = id == null ? null : parseInt(id, 10);
    switch (a) {
      case 'atualizar': atualizar(); break;
      case 'inicio': irInicio(); break;
      case 'criar-novo': irCriar(); break;
      case 'abrir': abrirEvento(b.getAttribute('data-cod')); break;
      case 'passo': S.vista = parseInt(b.getAttribute('data-p'), 10); S.confirmar = null; render(); noTopo(); break;
      case 'editar': abrirEdicao(); break;
      case 'editar-fechar': S.editar = false; S.confirmar = null; render(); break;
      case 'dias':
        var k = b.getAttribute('data-k'), nd = S[k].dias + parseInt(b.getAttribute('data-d'), 10);
        S[k].dias = Math.max(1, Math.min(30, nd)); render(); break;
      case 'dia': S.diaSel = parseInt(b.getAttribute('data-dia'), 10); S.confirmar = null; render(); break;
      case 'roda': S.verRoda = !S.verRoda; render(); break;
      case 'incluir-abrir': S.incluirAberto = !S.incluirAberto; S.confirmar = null; renderComFoco(); break;
      case 'incluir-fechar': S.incluirAberto = false; render(); break;
      case 'pedir': S.confirmar = {t: b.getAttribute('data-t'), cod: b.getAttribute('data-cod') || '', onde: b.getAttribute('data-onde') || ''}; S.pinConf = ''; S.pinErro = ''; renderComFoco(); break;
      case 'confirmar-pin': confirmarComPin(b.getAttribute('data-fn')); break;
      case 'hist-tudo': S.histTudo = !S.histTudo; render(); break;
      case 'cancelar': S.confirmar = null; render(); break;
      case 'pedir-remover': S.confirmar = {t: 'remover', id: id}; renderComFoco(); break;
      case 'remover': remover(id); break;
      case 'voltar': voltar(id); break;
      case 'status': mudarStatus({p_status: b.getAttribute('data-st')}, b.getAttribute('data-st') === 'aberto' ? (S.painel.evento.status === 'lista' ? 'Sorteio aberto. O QR já pode ir para o telão.' : 'Sorteio reaberto.') : 'Situação atualizada.', 'Mudando a situação…'); break;
      case 'confirmar-fechar': mudarStatus({p_status: 'fechado'}, 'Sorteio fechado. Só quem sorteou continua no jogo.', 'Fechando o sorteio…'); break;
      case 'confirmar-revelar': mudarStatus({p_revelar: true}, 'Revelação dos anjos liberada para os alunos.', 'Liberando a revelação…'); break;
      case 'confirmar-esconder': mudarStatus({p_revelar: false}, 'Revelação dos anjos escondida de novo.', 'Escondendo a revelação…'); break;
      case 'carregar-lista': carregarLista(); break;
      case 'telao': abrirTelao(); break;
      case 'copiar-link': copiarLink(); break;
    }
  });
  document.addEventListener('submit', function(ev){
    var f = ev.target.id;
    if (f === 'f-pin') {
      ev.preventDefault();
      var v = ($('pin').value || '').trim();
      if (!v) { S.gateErro = 'Digite o PIN.'; render(); var p = $('pin'); if (p) p.focus(); return; }
      entrarComPin(v, false);
    } else if (f === 'f-criar') { ev.preventDefault(); criar(); }
    else if (f === 'f-cfg') { ev.preventDefault(); salvarConfig(); }
    else if (f === 'f-incluir') { ev.preventDefault(); incluirNome(); }
  });
  document.addEventListener('input', function(ev){
    var t = ev.target, id = t.id;
    if (id === 'busca') { S.busca = t.value; var tb = $('linhas-sorteio'); if (tb && S.C) tb.innerHTML = linhasSorteio(); }
    else if (id === 'pin-conf') { S.pinConf = t.value; var pe = $('pin-err'); if (pe && pe.parentNode) pe.parentNode.removeChild(pe); S.pinErro = ''; }
    else if (id === 'texto-lista') S.textoLista = t.value;
    else if (id === 'novo-nome') S.novoNome = t.value;
    else if (id === 'n-nome') S.novo.nome = t.value;
    else if (id === 'n-inicio') S.novo.inicio = t.value;
    else if (id === 'c-nome') S.cfg.nome = t.value;
    else if (id === 'c-inicio') S.cfg.inicio = t.value;
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'pin-conf') { ev.preventDefault(); confirmarComPin(ev.target.getAttribute('data-fn')); return; }
    if (ev.key === 'Escape' && S.confirmar) { S.confirmar = null; render(); }
  });

  // atualização automática: só com a aba visível
  setInterval(function(){ if (document.visibilityState === 'visible') atualizar(); }, AUTO_MS);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && S.atualizadoEm && Date.now() - S.atualizadoEm.getTime() > AUTO_MS) atualizar();
  });

  // ---------- início ----------
  render();
  var guardado = pinGuardado();
  if (guardado) entrarComPin(guardado, true);
  else { var p0 = $('pin'); if (p0) p0.focus(); }
})();
</script>
</body>
</html>
